/* ============================================================
   13. SPEECH SERVICE
   One abstraction, one provider today (WebKit SpeechRecognition).
   Swap the internals to change transcription engine later.
   - continuous mode so a pause mid-sentence does not end the entry
   - a fresh recogniser per recording (no stale state between takes)
   - no timers racing the iOS permission prompt
   - if WebKit never reports the end after Stop, commit anyway
   ============================================================ */
var Speech = (function(){
  var Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, state = 'idle', finals = '', interim = '';
  var disabled = false, reason = '', onChange = null, stopTimer = null;

  function supported(){ return !!Ctor && !disabled; }
  function status(){
    if(!Ctor) return 'Not available in this browser';
    if(disabled) return reason || 'Unavailable';
    return 'Available';
  }
  function text(){ return (finals + ' ' + interim).replace(/\s+/g,' ').trim(); }
  function emit(s, extra){ state = s; if(onChange) onChange(s, text(), extra||''); }

  function build(){
    var r = new Ctor();
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    try{ r.lang = navigator.language || 'en-NZ'; }catch(e){}

    r.onstart = function(){ if(rec === r && state === 'starting') emit('listening'); };
    r.onresult = function(e){
      if(rec !== r) return;
      /* rebuild from every result each time, so nothing is ever doubled */
      var f = '', it = '';
      for(var i = 0; i < e.results.length; i++){
        var res = e.results[i], tx = (res && res[0]) ? res[0].transcript : '';
        if(res.isFinal) f += (f ? ' ' : '') + tx; else it += tx;
      }
      finals = f; interim = it;
      emit(state === 'stopping' ? 'stopping' : 'listening');
    };
    r.onerror = function(e){
      if(rec !== r) return;
      var code = (e && e.error) || 'unknown';
      if(code === 'aborted') return;               /* our own abort; onend decides */
      if(code === 'no-speech' && text()) return;    /* keep what we have */
      rec = null; clearTimeout(stopTimer);
      try{ r.abort(); }catch(x){}
      if(code === 'not-allowed' || code === 'service-not-allowed'){
        disabled = true;
        reason = 'Microphone blocked — allow it in iPhone Settings';
        emit('error', 'Microphone or speech access was refused. Use the microphone on the keyboard instead.');
      } else if(code === 'no-speech'){
        emit('error', 'Did not catch that.');
      } else if(code === 'network'){
        emit('error', 'Dictation needs an internet connection.');
      } else {
        emit('error', 'Dictation stopped (' + code + ').');
      }
    };
    r.onend = function(){ if(rec === r) finish(); };
    return r;
  }
  function finish(){
    clearTimeout(stopTimer);
    rec = null;
    if(state === 'listening' || state === 'stopping' || state === 'starting'){
      if(text()) emit('final'); else emit('idle');
    }
  }
  function start(){
    if(!supported()) return false;
    if(rec){ var old = rec; rec = null; try{ old.abort(); }catch(e){} }
    finals = ''; interim = '';
    try{
      rec = build();
      emit('starting');
      rec.start();                 /* called inside the tap: iOS asks permission itself */
      return true;
    }catch(err){
      rec = null;
      emit('error', 'Dictation could not start.');
      return false;
    }
  }
  function stop(){
    if(!rec){ if(state !== 'idle') emit('idle'); return; }
    if(state === 'starting' && !text()){
      var r0 = rec; rec = null;
      try{ r0.abort(); }catch(e){}
      emit('idle');
      return;
    }
    emit('stopping');
    try{ rec.stop(); }catch(e){ finish(); return; }
    clearTimeout(stopTimer);
    stopTimer = setTimeout(function(){
      if(!rec) return;
      var r1 = rec;
      finish();                    /* commit what was heard */
      try{ r1.abort(); }catch(x){}
    }, 2000);
  }
  function reset(){ finals = ''; interim = ''; state = 'idle'; }

  return {
    supported: supported, status: status, start: start, stop: stop,
    reset: reset, text: text,
    getState: function(){ return state; },
    on: function(fn){ onChange = fn; }
  };
})();

/* ---------- mic UI ---------- */
function initSpeech(){
  var mic = $('mic'), strip = $('inbox-speech'), hideT = null;
  function micIcon(name){ var u = mic.querySelector('use'); if(u) u.setAttribute('href', '#i-'+name); }
  function later(ms){ clearTimeout(hideT); hideT = setTimeout(hideStrip, ms); }
  if(!Speech.supported()) mic.classList.add('is-busy');

  Speech.on(function(state, txt, msg){
    clearTimeout(hideT);
    mic.classList.remove('is-live','is-busy');
    strip.classList.remove('err');
    if(state === 'starting'){
      mic.classList.add('is-live'); micIcon('stop');
      showStrip('<b>Starting…</b>');
    } else if(state === 'listening'){
      mic.classList.add('is-live'); micIcon('stop');
      showStrip(txt ? '<span class="live">'+esc(txt)+'</span>' : '<b>Listening</b> — tap stop when you are done');
    } else if(state === 'stopping'){
      mic.classList.add('is-busy'); micIcon('mic');
      showStrip(txt ? '<span class="live">'+esc(txt)+'</span>' : '<b>Finishing…</b>');
    } else if(state === 'final'){
      micIcon('mic');
      var t = Speech.text();
      Speech.reset();
      hideStrip();
      if(t){
        addTask(t, INBOX);
        renderInbox(); updateBadges(); scrollInboxToEnd();
      }
    } else if(state === 'error'){
      micIcon('mic');
      var partial = Speech.text();
      Speech.reset();
      if(partial){
        /* nothing heard is ever thrown away */
        var inp = $('capture-input');
        inp.value = partial;
        syncCaptureState();
        showStrip('Kept what was heard — tap the box to check it, then add.');
      } else {
        strip.classList.add('err');
        showStrip(esc(msg || 'Dictation stopped.'));
      }
      later(6000);
      if(!Speech.supported()) mic.classList.add('is-busy');
    } else {
      micIcon('mic');
      hideStrip();
      if(!Speech.supported()) mic.classList.add('is-busy');
    }
  });

  mic.addEventListener('click', function(){
    var st = Speech.getState();
    if(st === 'listening' || st === 'starting'){ Speech.stop(); return; }
    if(st === 'stopping') return;
    if(!Speech.supported()){
      strip.classList.add('err');
      showStrip(esc(Speech.status()) + ' — use the microphone on the keyboard.');
      later(4500);
      focusCapture();              /* inside the tap, so the keyboard opens */
      return;
    }
    Speech.start();
  });
}
function showStrip(html){
  var s = $('inbox-speech');
  s.innerHTML = html;
  s.classList.remove('hidden');
}
function hideStrip(){
  var s = $('inbox-speech');
  s.classList.add('hidden');
  s.classList.remove('err');
  s.innerHTML = '';
}

/* ============================================================
   14. CAPTURE BAR
   iOS only opens the keyboard when focus happens inside a tap,
   so nothing here focuses on its own. One tap anywhere on the
   bar (or the empty space above it) opens the keyboard; after
   that, focus is never released between entries.
   ============================================================ */
function syncCaptureState(){
  var v = $('capture-input').value.trim();
  $('capture').classList.toggle('has-text', !!v);
}
function focusCapture(){
  var inp = $('capture-input');
  if(!inp) return;
  try{ inp.focus({preventScroll:true}); }catch(e){ try{ inp.focus(); }catch(x){} }
}
function blurCapture(){
  var inp = $('capture-input');
  if(inp && document.activeElement === inp) inp.blur();
}
function scrollInboxToEnd(){
  var sc = $('inbox-scroll');
  if(sc) sc.scrollTop = sc.scrollHeight;
}
function submitCapture(){
  var inp = $('capture-input');
  var v = inp.value.trim();
  if(!v) return;
  addTask(v, INBOX);
  inp.value = '';
  syncCaptureState();
  renderInbox();
  updateBadges();
  scrollInboxToEnd();
  /* no toast here: the new row appears right above the bar */
}
function initCapture(){
  var inp = $('capture-input');
  inp.addEventListener('input', syncCaptureState);
  inp.addEventListener('focus', function(){ $('capture').classList.add('is-focus'); });
  inp.addEventListener('blur',  function(){ $('capture').classList.remove('is-focus'); });
  inp.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); submitCapture(); }
  });
  /* pointerdown+preventDefault keeps focus on the input, so the keyboard never drops */
  $('capture-send').addEventListener('pointerdown', function(e){ e.preventDefault(); });
  $('capture-send').addEventListener('click', function(){ submitCapture(); focusCapture(); });
  /* the whole bar is one large tap target */
  $('capture').addEventListener('click', function(e){
    if(sel.on) return;
    if(e.target.closest('#mic, #capture-send')) return;
    focusCapture();
  });
  /* so is the empty space above it */
  $('inbox-scroll').addEventListener('click', function(e){
    if(sel.on) return;
    if(e.target.closest('button, input, a, .row, .ghead')) return;
    focusCapture();
  });
}

/* ============================================================
   15. BACKUP
   ============================================================ */
function collectBackup(withAttachments){
  var data = {containers:[], tasks:[], subtasks:[], meta:[]};
  var k;
  for(k in S.containers) data.containers.push(S.containers[k]);
  for(k in S.tasks) data.tasks.push(S.tasks[k]);
  for(k in S.subtasks) data.subtasks.push(S.subtasks[k]);
  for(k in S.meta) data.meta.push({key:k, value:S.meta[k]});
  var payload = {
    app:'Do It!', format:1, appVersion:APP_VERSION, dbVersion:DB_VERSION,
    exportedAt: now(), data: data
  };
  if(!withAttachments) return Promise.resolve(payload);
  var atts = [];
  for(k in S.attachments) atts.push(S.attachments[k]);
  if(!atts.length){ payload.data.attachments = []; return Promise.resolve(payload); }
  return Promise.all(atts.map(function(a){
    return new Promise(function(res){
      if(!a.blob){ res(null); return; }
      var fr = new FileReader();
      fr.onload = function(){
        var c = clone({id:a.id, taskId:a.taskId, fileName:a.fileName, mimeType:a.mimeType,
                       size:a.size, createdAt:a.createdAt, deleted:a.deleted});
        c.dataUrl = fr.result;
        res(c);
      };
      fr.onerror = function(){ res(null); };
      fr.readAsDataURL(a.blob);
    });
  })).then(function(list){
    payload.data.attachments = list.filter(Boolean);
    return payload;
  });
}
function exportBackup(withAttachments){
  collectBackup(withAttachments).then(function(payload){
    var json = JSON.stringify(payload);
    var name = 'do-it-backup-' + dateKey() + '.json';
    var blob = new Blob([json], {type:'application/json'});
    metaSet('lastBackupAt', now());
    renderSettings();
    var file = null;
    try{ file = new File([blob], name, {type:'application/json'}); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      navigator.share({files:[file], title:'Do It! backup'})
        ['catch'](function(){ downloadBlob(blob, name); });
    } else {
      downloadBlob(blob, name);
    }
  })['catch'](function(e){
    console.error(e);
    toast('Export failed', null);
  });
}
function downloadBlob(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 4000);
}
function startImport(){ $('file-import').click(); }
function handleImportFile(file){
  var fr = new FileReader();
  fr.onload = function(){
    var payload;
    try{ payload = JSON.parse(fr.result); }
    catch(e){ toast('That file is not valid JSON', null); return; }
    if(!payload || payload.app !== 'Do It!' || !payload.data){
      toast('That is not a Do It! backup', null); return;
    }
    var d = payload.data;
    if(!Array.isArray(d.tasks) || !Array.isArray(d.containers)){
      toast('That backup is missing data', null); return;
    }
    previewImport(payload);
  };
  fr.onerror = function(){ toast('Could not read that file', null); };
  fr.readAsText(file);
}
function previewImport(payload){
  var d = payload.data;
  var live = d.tasks.filter(function(t){ return !t.deleted; }).length;
  var done = d.tasks.filter(function(t){ return !t.deleted && t.completed; }).length;
  var when = new Date(payload.exportedAt || 0);
  var summary = '<div class="note" style="padding:4px 16px 14px">Backup from ' +
    esc(when.getDate()+' '+MONTHS[when.getMonth()]+' '+when.getFullYear()) + '<br>' +
    esc(plural(d.containers.filter(function(c){return !c.deleted;}).length,'list')) + ' · ' +
    esc(plural(live,'task')) + ' · ' + esc(plural(done,'completed','completed')) + ' · ' +
    esc(plural((d.subtasks||[]).length,'subtask')) +
    (d.attachments ? ' · ' + esc(plural(d.attachments.length,'attachment')) : '') + '</div>';
  menuWithSummary('Import backup', summary, [
    {label:'Merge into what I have (nothing is lost)', run:function(){ runImport(payload, 'merge'); }},
    {label:'Replace everything with this backup', danger:true, run:function(){ confirmReplace(payload); }}
  ]);
}
function menuWithSummary(title, summaryHtml, actions){
  menu(title, actions);
  var body = $('pick-body');
  body.insertAdjacentHTML('afterbegin', summaryHtml);
}
function confirmReplace(payload){
  setTimeout(function(){
    menu('Replace everything?', [
      {label:'Yes — delete my current data and restore', danger:true, run:function(){ runImport(payload,'replace'); }},
      {label:'Cancel', run:function(){}}
    ]);
    $('pick-body').insertAdjacentHTML('afterbegin',
      '<div class="note" style="padding:4px 16px 14px">Everything currently in Do It! on this device will be removed and replaced. This cannot be undone.</div>');
  }, 260);
}
function runImport(payload, mode){
  var d = payload.data;
  var stores = ['containers','tasks','subtasks','attachments','meta'];
  var work = Promise.resolve();
  if(mode === 'replace'){
    work = new Promise(function(res, rej){
      var tx = db.transaction(stores, 'readwrite');
      stores.forEach(function(n){ tx.objectStore(n).clear(); });
      tx.oncomplete = function(){
        S.containers = {}; S.tasks = {}; S.subtasks = {}; S.attachments = {}; S.meta = {};
        res();
      };
      tx.onerror = function(){ rej(tx.error); };
    });
  }
  work.then(function(){
    var batch = {containers:[], tasks:[], subtasks:[], attachments:[], meta:[]};
    function take(arr, storeName, keyName){
      (arr||[]).forEach(function(rec){
        if(!rec || !rec[keyName||'id']) return;
        var id = rec[keyName||'id'];
        var existing = S[storeName] ? S[storeName][id] : null;
        if(mode === 'merge' && existing && (existing.updatedAt||0) >= (rec.updatedAt||0)) return;
        if(storeName === 'meta'){ S.meta[rec.key] = rec.value; batch.meta.push(rec); return; }
        S[storeName][id] = rec;
        batch[storeName].push(rec);
      });
    }
    take(d.containers,'containers');
    take(d.tasks,'tasks');
    take(d.subtasks,'subtasks');
    (d.meta||[]).forEach(function(m){
      if(!m || !m.key) return;
      S.meta[m.key] = m.value; batch.meta.push(m);
    });
    (d.attachments||[]).forEach(function(a){
      if(!a || !a.id) return;
      var rec = {id:a.id, taskId:a.taskId, fileName:a.fileName, mimeType:a.mimeType,
                 size:a.size, createdAt:a.createdAt, deleted:a.deleted||0, blob:null};
      if(a.dataUrl){ try{ rec.blob = dataUrlToBlob(a.dataUrl); }catch(e){} }
      S.attachments[rec.id] = rec;
      batch.attachments.push(rec);
    });
    return idbPutMany(stores, batch).then(function(){
      closeSheets();
      renderAll();
      var n = (d.tasks||[]).length;
      toast(mode==='replace' ? 'Restored '+plural(n,'task') : 'Merged '+plural(n,'task'), null);
    });
  })['catch'](function(e){
    console.error(e);
    toast('Import failed — nothing was changed', null);
  });
}
function dataUrlToBlob(u){
  var parts = u.split(','), m = /:(.*?);/.exec(parts[0]);
  var bin = atob(parts[1]), n = bin.length, arr = new Uint8Array(n);
  while(n--) arr[n] = bin.charCodeAt(n);
  return new Blob([arr], {type: m ? m[1] : 'application/octet-stream'});
}
function purgeDeleted(){
  var removed = 0, k;
  for(k in S.tasks){ if(S.tasks[k].deleted){ purgeTask(S.tasks[k]); removed++; } }
  for(k in S.containers){
    if(S.containers[k].deleted){ var id=S.containers[k].id; delete S.containers[id]; persistDel('containers', id); removed++; }
  }
  renderAll();
  toast(removed ? plural(removed,'item')+' removed for good' : 'Nothing to remove', null);
}

/* ============================================================
   16. PERSISTENT STORAGE
   ============================================================ */
function requestPersistence(){
  if(!navigator.storage || !navigator.storage.persisted) return;
  navigator.storage.persisted().then(function(granted){
    if(granted){ S.meta.persisted = true; metaSet('persisted', true); return; }
    if(!navigator.storage.persist) return;
    navigator.storage.persist().then(function(ok){
      metaSet('persisted', !!ok);
    })['catch'](function(){});
  })['catch'](function(){});
}

/* ============================================================
   17. EVENT WIRING
   ============================================================ */
function wireEvents(){
  /* --- bottom navigation: always goes straight to the tab --- */
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b){
    b.addEventListener('click', function(){ showTab(b.dataset.tab); });
  });

  /* --- header buttons --- */
  $('open-settings').addEventListener('click', function(){ push('settings'); renderSettings(); });
  $('settings-back').addEventListener('click', goBack);
  $('list-back').addEventListener('click', goBack);
  $('done-back').addEventListener('click', goBack);
  $('lists-add').addEventListener('click', function(){ openListEditor(null, ROOT); });
  $('today-add').addEventListener('click', function(){ openQuickCapture(true); });
  $('inbox-select').addEventListener('click', function(){ sel.on ? exitSelect() : enterSelect('inbox'); });
  $('today-select').addEventListener('click', function(){ sel.on ? exitSelect() : enterSelect('today'); });
  $('list-select').addEventListener('click', function(){ sel.on ? exitSelect() : enterSelect('list'); });
  $('list-more').addEventListener('click', listMenu);
  $('fab').addEventListener('click', function(){ openQuickCapture(curTab === 'today'); });

  /* --- search --- */
  var sTimer = null;
  $('search-input').addEventListener('input', function(){
    clearTimeout(sTimer);
    sTimer = setTimeout(renderSearch, 90);
  });

  /* --- sheets: the scrim closes only the sheet on top --- */
  $('scrim').addEventListener('click', closeTopSheet);
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function(b){
    b.addEventListener('click', function(){
      var sheet = b.closest('.sheet');
      if(!sheet) return;
      if(sheet.id === 'sh-task'){ editing = null; editDraft = null; closeSheet('sh-task'); renderAll(); return; }
      if(sheet.id === 'sh-qc'){ closeQuickCapture(); return; }
      if(sheet.id === 'sh-list'){ listDraft = null; }
      closeSheet(sheet.id);
    });
  });
  $('task-save').addEventListener('click', commitTask);
  $('le-save').addEventListener('click', commitList);
  $('qc-save').addEventListener('click', commitQuickCapture);

  /* --- toast --- */
  $('toast-undo').addEventListener('click', function(){
    if(toastFn){ toastFn(); }
    hideToast();
  });

  /* --- selection action bar --- */
  Array.prototype.forEach.call($('selbar').querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){ runBulk(b.dataset.act); });
  });

  /* --- file inputs --- */
  $('file-import').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if(f) handleImportFile(f);
    e.target.value = '';
  });
  $('file-att').addEventListener('change', function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    files.forEach(attachFile);
    e.target.value = '';
  });

  /* --- one delegated click handler for rendered content --- */
  document.addEventListener('click', onDelegatedClick);

  /* --- task sheet: keep the draft in step with typing, so a re-render never loses it --- */
  $('task-body').addEventListener('input', function(e){
    var id = e.target.id;
    if(id === 'te-title'){ autoGrow(e.target); if(editDraft) editDraft.title = e.target.value; }
    else if(id === 'te-notes'){ if(editDraft) editDraft.notes = e.target.value; }
    else if(id === 'te-link'){ if(editDraft) editDraft.linkUrl = e.target.value; }
    var sid = e.target.dataset.subtitle;
    if(sid && S.subtasks[sid]){
      S.subtasks[sid].title = e.target.value;
      saveSubtask(S.subtasks[sid]);
    }
  });
  $('task-body').addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    if(e.target.id === 'te-newsub'){
      e.preventDefault();
      var v = e.target.value.trim();
      if(v && editing){ addSubtask(editing.id, v); renderTaskSheet(); focusField('te-newsub'); }
    } else if(e.target.id === 'te-title' || e.target.dataset.subtitle){
      e.preventDefault();
      e.target.blur();
    }
  });
  $('task-body').addEventListener('change', function(e){
    if(!editing) return;
    if(e.target.id === 'te-date'){ editDraft.dueDate = e.target.value; editing.dueDate = e.target.value; saveTask(editing); renderTaskSheet(); }
    if(e.target.id === 'te-time'){ editDraft.dueTime = e.target.value; editing.dueTime = e.target.value; saveTask(editing); renderTaskSheet(); }
  });

  /* --- list editor: keep the typed name when a colour or parent is picked --- */
  $('le-body').addEventListener('input', function(e){
    if(e.target.id === 'le-name' && listDraft) listDraft.name = e.target.value;
  });
  $('le-body').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.id === 'le-name'){ e.preventDefault(); commitList(); }
  });

  /* --- quick capture: return adds and keeps going --- */
  $('qc-body').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.id === 'qc-text'){ e.preventDefault(); qcAddOne(); }
  });
}

function onDelegatedClick(e){
  var t = e.target;
  var n;

  /* complete / restore */
  if((n = t.closest('[data-check]'))){ var tk = S.tasks[n.dataset.check]; if(tk) toggleComplete(tk); return; }
  /* selection circle */
  if((n = t.closest('[data-sel]'))){ toggleSel(n.dataset.sel); return; }
  /* task action menu */
  if((n = t.closest('[data-more]'))){ var mt = S.tasks[n.dataset.more]; if(mt) taskMenu(mt); return; }
  /* open task */
  if((n = t.closest('[data-open]'))){
    var id = n.dataset.open;
    if(sel.on){ toggleSel(id); return; }
    openTask(id); return;
  }
  /* selection tap anywhere on a row while in selection mode */
  if(sel.on && (n = t.closest('.row')) && n.dataset.id){ toggleSel(n.dataset.id); return; }
  /* permanent delete from history */
  if((n = t.closest('[data-purge]'))){
    var pt = S.tasks[n.dataset.purge];
    if(!pt) return;
    menu('Delete permanently?', [
      {label:'Delete “'+pt.title.slice(0,40)+'”', danger:true, run:function(){ purgeTask(pt); renderAll(); toast('Deleted permanently', null); }},
      {label:'Cancel', run:function(){}}
    ]);
    return;
  }
  /* collapse toggles */
  if((n = t.closest('[data-collapse]'))){ toggleCollapse(n.dataset.collapse); return; }
  /* new list from the Lists screen */
  if(t.closest('[data-newlist]')){ openListEditor(null, ROOT); return; }
  /* open a list */
  if((n = t.closest('[data-list]'))){ openList(n.dataset.list); return; }
  /* picker choice (including "New list", which finishes the pick once saved) */
  if((n = t.closest('[data-pick]'))){
    var fn = $('pick-body').__onPick;
    closeSheet('sh-pick');
    if(n.dataset.pick === '__new'){ openListEditor(null, ROOT, fn); return; }
    if(fn) fn(n.dataset.pick);
    return;
  }
  /* menu choice */
  if((n = t.closest('[data-menu]'))){
    var mfn = $('pick-body').__onMenu;
    if(mfn) mfn(+n.dataset.menu);
    return;
  }
  /* list editor bits */
  if((n = t.closest('[data-colour]'))){
    if(listDraft){ listDraft.colour = n.dataset.colour; renderListEditor(); }
    return;
  }
  if(t.closest('#le-parent')){
    if(!listDraft) return;
    var nameEl = $('le-name'); if(nameEl) listDraft.name = nameEl.value;
    pickContainer({title:'Put this list inside', allowRoot:true, excludeId:listDraft.id, current:listDraft.parentId,
      onPick:function(pid){ if(listDraft){ listDraft.parentId = pid; renderListEditor(); } }});
    return;
  }
  if(t.closest('#le-delete')){
    var lc = listDraft ? S.containers[listDraft.id] : null;
    listDraft = null;
    closeSheet('sh-list');
    if(lc) deleteContainer(lc);
    return;
  }
  /* task editor bits */
  if(t.closest('#te-list')){
    if(!editing) return;
    pickContainer({title:'Move task to', includeInbox:true, current:editing.containerId, allowCreate:true,
      onPick:applyEditorMove});
    return;
  }
  if((n = t.closest('[data-clear]'))){
    if(n.dataset.clear === 'date'){ editDraft.dueDate=''; editing.dueDate=''; editing.dueTime=''; editDraft.dueTime=''; }
    else { editDraft.dueTime=''; editing.dueTime=''; }
    saveTask(editing); renderTaskSheet(); return;
  }
  if((n = t.closest('[data-subcheck]'))){
    var s = S.subtasks[n.dataset.subcheck];
    if(s){ s.completed = s.completed?0:1; saveSubtask(s); renderTaskSheet(); }
    return;
  }
  if((n = t.closest('[data-subdel]'))){
    var sd = S.subtasks[n.dataset.subdel];
    if(sd){ sd.deleted = 1; saveSubtask(sd); renderTaskSheet(); }
    return;
  }
  if(t.closest('#te-addatt')){ $('file-att').click(); return; }
  if((n = t.closest('[data-att]')) && !t.closest('[data-attdel]')){
    var oa = S.attachments[n.dataset.att];
    if(oa && oa.blob){
      try{
        var ou = URL.createObjectURL(oa.blob);
        window.open(ou, '_blank');
        setTimeout(function(){ URL.revokeObjectURL(ou); }, 30000);
      }catch(err){ toast('Could not open that file', null); }
    }
    return;
  }
  if((n = t.closest('[data-attdel]'))){
    var a = S.attachments[n.dataset.attdel];
    if(a){ delete S.attachments[a.id]; persistDel('attachments', a.id); renderTaskSheet(); }
    return;
  }
  if(t.closest('#te-delete')){
    var dt = editing;
    editing = null; editDraft = null;
    closeSheet('sh-task');
    if(dt) deleteTasks([dt]);
    return;
  }
  /* quick capture destination: only the label changes, typed text stays */
  if(t.closest('#qc-dest')){
    pickContainer({title:'Add to', includeInbox:true, current:qcDest, allowCreate:true, onPick:function(cid){
      qcDest = cid;
      var d = $('qc-dest'); if(d) d.textContent = containerLabel(cid);
      focusField('qc-text');
    }});
    return;
  }
  /* settings rows */
  if((n = t.closest('#settings-body [data-act]'))){ settingsAction(n.dataset.act); return; }
}

function settingsAction(act){
  if(act === 'export'){
    menu('Export backup', [
      {label:'Tasks, lists and notes', run:function(){ exportBackup(false); }},
      {label:'Everything including attachments', run:function(){ exportBackup(true); }}
    ]);
  }
  else if(act === 'import') startImport();
  else if(act === 'history'){ push('done'); renderDone(); }
  else if(act === 'purge'){
    menu('Empty deleted items?', [
      {label:'Remove them for good', danger:true, run:purgeDeleted},
      {label:'Cancel', run:function(){}}
    ]);
  }
  else if(act === 'update') location.reload();
}

function openList(id){
  curList = id;
  push('list', id);          /* nested lists each get their own Back step */
  renderListScreen();
  attachListDrag();
}
function listMenu(){
  if(curList === INBOX) return;
  var c = S.containers[curList];
  if(!c) return;
  menu(c.name, [
    {label:'Edit name and colour', run:function(){ openListEditor(c); }},
    {label:'New list inside this one', run:function(){ openListEditor(null, c.id); }},
    {label:'Move to another list', run:function(){
      pickContainer({title:'Move “'+c.name+'” into', allowRoot:true, excludeId:c.id, current:c.parentId,
        onPick:function(pid){ moveContainer(c, pid); }});
    }},
    {label:'Delete list', danger:true, run:function(){ deleteContainer(c); }}
  ]);
}

/* ---------- bulk actions ---------- */
function runBulk(act){
  var list = selectedTasks();
  if(!list.length) return;
  if(act === 'complete'){ exitSelect(); completeTasks(list); return; }
  if(act === 'delete'){ exitSelect(); deleteTasks(list); return; }
  if(act === 'dup'){ exitSelect(); duplicateTasks(list); return; }
  if(act === 'move' || act === 'copy'){
    pickContainer({title:(act==='move'?'Move':'Copy')+' '+plural(list.length,'task')+' to',
      includeInbox:true, allowCreate:true,
      onPick:function(cid){
        exitSelect();
        if(act === 'move') moveTasks(list, cid); else copyTasks(list, cid);
      }});
  }
}

/* ---------- attachments ---------- */
function attachFile(file){
  if(!editing) return;
  var a = {
    id:uid(), taskId:editing.id, fileName:file.name || 'file',
    mimeType:file.type || 'application/octet-stream', size:file.size || 0,
    blob:file, createdAt:now(), deleted:0
  };
  S.attachments[a.id] = a;
  persist('attachments', a);
  renderTaskSheet();
}

/* ============================================================
   18. DRAG WIRING
   ============================================================ */
function attachDrags(){
  attachDrag({
    scroller: $('inbox-scroll'), container: $('inbox-rows'),
    itemSel: '.row.re', handleSel: '[data-drag]',
    onDrop: function(from, to){
      applyReorder(tasksIn(INBOX,0), from, to, 'tasks');
      renderInbox();
    }
  });
  attachDrag({
    scroller: $('sc-lists').querySelector('.scroller'), container: $('lists-tree'),
    itemSel: '.tnode', handleSel: '[data-drag]',
    onDrop: function(from, to, ids){
      var moverId = ids[from], targetId = ids[to];
      var mover = S.containers[moverId], target = S.containers[targetId];
      if(!mover || !target){ renderLists(); return; }
      if(mover.parentId !== target.parentId){
        renderLists();
        toast('Lists reorder inside their own level. Use Move to change level.', null);
        return;
      }
      var sibs = siblings(mover.parentId);
      var fi = sibs.indexOf(mover), ti = sibs.indexOf(target);
      applyReorder(sibs, fi, ti, 'containers');
      renderLists();
    }
  });
  attachDrag({
    scroller: $('task-body'), container: $('task-body'),
    itemSel: '.sub', handleSel: '.grip',
    onDrop: function(from, to){
      if(!editing) return;
      applyReorder(subtasksOf(editing.id), from, to, 'subtasks');
      renderTaskSheet();
    }
  });
  attachLongPress($('inbox-rows'), '.row', function(rowEl){
    if(rowEl.dataset.id) enterSelect('inbox', rowEl.dataset.id);
  });
  attachLongPress($('today-rows'), '.row', function(rowEl){
    if(rowEl.dataset.id) enterSelect('today', rowEl.dataset.id);
  });
}
function attachListDrag(){
  var body = $('list-body');
  if(body.__dragged) return;
  body.__dragged = true;
  attachDrag({
    scroller: $('list-scroll'), container: body,
    itemSel: '.row.re', handleSel: '[data-drag]',
    onDrop: function(from, to){
      applyReorder(tasksIn(curList,0), from, to, 'tasks');
      renderListScreen();
    }
  });
  attachLongPress(body, '.row', function(rowEl){
    if(rowEl.dataset.id) enterSelect('list', rowEl.dataset.id);
  });
}

/* ============================================================
   19. SERVICE WORKER
   ============================================================ */
var reloading = false;
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.addEventListener('updatefound', function(){});
  })['catch'](function(e){ console.warn('SW registration failed', e); });

  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(reloading) return;
    var busy = anySheetOpen() || ($('capture-input') && $('capture-input').value.trim());
    if(busy){
      toast('Update ready — reload when you are done', null);
      return;
    }
    reloading = true;
    location.reload();
  });
}

/* ============================================================
   20. BOOT
   ============================================================ */
var lastDayKey = dateKey();
function startClock(){
  setInterval(function(){
    var k = dateKey();
    if(k !== lastDayKey){ lastDayKey = k; renderAll(); }
  }, 30000);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    syncViewport();
    var k = dateKey();
    if(k !== lastDayKey) lastDayKey = k;
    renderAll();
  });
}

function fatal(msg){
  document.body.innerHTML = '<div style="padding:40px 22px;font:17px -apple-system,system-ui,sans-serif">'+
    '<h1 style="font-size:22px;margin:0 0 10px">Do It! could not start</h1>'+
    '<p style="color:#6E727C;line-height:1.5">'+esc(msg)+'</p>'+
    '<p style="color:#6E727C;line-height:1.5">Your tasks are still stored on this device. '+
    'Close the app fully and open it again. If that does not help, make sure Private Browsing is off.</p></div>';
}

function boot(){
  toastEl = $('toast'); toastTextEl = $('toast-text'); toastUndoEl = $('toast-undo');
  initViewport();
  wireEvents();
  initCapture();
  initSpeech();

  openDB()
    .then(loadAll)
    .then(function(){
      showTab('inbox');
      renderAll();
      attachDrags();
      requestPersistence();
      registerSW();
      startClock();
      document.body.classList.add('ready');
    })
    ['catch'](function(err){
      console.error(err);
      fatal('The local database would not open. ' + (err && err.message ? err.message : ''));
    });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
