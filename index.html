<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Do It!">
<meta name="theme-color" content="#FFFFFF">
<meta name="format-detection" content="telephone=no">
<title>Do It!</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" href="icon.png">
<style>
/* ============================================================
   Do It! — design tokens
   ============================================================ */
:root{
  --paper:#FFFFFF;
  --sink:#F4F5F7;
  --sink-2:#EDEEF1;
  --ink:#16181D;
  --ink-2:#6E727C;
  --ink-3:#9AA0AA;
  --rule:#E6E7EB;
  --accent:#3D3AF5;
  --accent-soft:#EEEEFE;
  --danger:#D93B3B;
  --gut:16px;
  --row:52px;
  --nav-h:calc(52px + env(safe-area-inset-bottom,0px));
  --kb:0px;                 /* keyboard height, set from visualViewport */
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:26px;
  --shadow-sheet:0 -1px 0 var(--rule), 0 -20px 40px rgba(20,22,28,.10);
  --shadow-lift:0 8px 24px rgba(20,22,28,.16);
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overscroll-behavior:none}
body{
  background:var(--paper);
  color:var(--ink);
  font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.011em;
  overflow:hidden;
  position:fixed; inset:0; width:100%;
}
button,input,textarea,select{font:inherit;color:inherit;margin:0}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none}
input,textarea{-webkit-appearance:none;background:none;border:0;outline:none}
ul{margin:0;padding:0;list-style:none}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.no-sel{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============================================================
   App shell
   ============================================================ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

.screen{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  background:var(--paper);
  padding-top:env(safe-area-inset-top,0px);
  visibility:hidden; opacity:0;
  transition:opacity .16s linear, visibility 0s .16s;
}
.screen.is-active{visibility:visible;opacity:1;transition:opacity .16s linear}

/* push-in transition for drill-down screens */
.screen.is-pushed{transform:translateX(100%);transition:transform .3s var(--ease),visibility 0s .3s}
.screen.is-pushed.is-active{transform:translateX(0);transition:transform .3s var(--ease)}

.topbar{
  flex:0 0 auto; display:flex; align-items:flex-end; gap:8px;
  padding:6px var(--gut) 10px;
  min-height:44px;
}
.topbar .grow{flex:1 1 auto;min-width:0}
.title{
  font-size:28px; font-weight:700; letter-spacing:-.028em; line-height:1.15;
  margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.title-sub{font-size:13px;color:var(--ink-2);letter-spacing:0;margin-top:2px}
.iconbtn{
  flex:0 0 auto; width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;color:var(--ink);
  transition:background .12s linear;
}
.iconbtn:active{background:var(--sink-2)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.small svg{width:19px;height:19px}
.textbtn{
  flex:0 0 auto;color:var(--accent);font-size:16px;font-weight:500;
  padding:8px 4px;min-height:40px;
}
.textbtn:active{opacity:.55}
.textbtn.muted{color:var(--ink-2)}
.textbtn.danger{color:var(--danger)}

.scroller{
  flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

/* ============================================================
   Task rows
   ============================================================ */
.rows{padding-bottom:8px}
.row{
  position:relative; display:flex; align-items:flex-start; gap:12px;
  padding:0 var(--gut) 0 0; margin-left:var(--gut);
  min-height:var(--row); background:var(--paper);
  touch-action:pan-y;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; cursor:pointer;
}
.row::after{
  content:""; position:absolute; left:40px; right:0; bottom:0; height:1px;
  background:var(--rule); transform:scaleY(.5); transform-origin:bottom;
}
.row:last-child::after{opacity:0}
.row.is-dragging{
  z-index:40; box-shadow:var(--shadow-lift); border-radius:var(--r-md);
  margin-left:8px; margin-right:8px; padding-left:8px;
  background:var(--paper);
}
.row.is-dragging::after{opacity:0}
.row.is-ghost{opacity:.28}
.row-accent{
  position:absolute; left:-16px; top:8px; bottom:8px; width:3px; border-radius:2px;
  background:var(--c,transparent);
}
.check{
  flex:0 0 auto; width:28px;height:28px;margin:12px 0 0 0;
  display:grid;place-items:center; border-radius:50%;
}
.check i{
  display:block;width:21px;height:21px;border-radius:50%;
  border:1.8px solid var(--ink-3); transition:background .14s var(--ease),border-color .14s var(--ease);
}
.check:active i{transform:scale(.88)}
.row.done .check i{background:var(--accent);border-color:var(--accent)}
.check svg{position:absolute;width:12px;height:12px;stroke:#fff;stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .14s linear}
.row.done .check svg{opacity:1}
.row-main{flex:1 1 auto;min-width:0;padding:15px 0 14px;display:block;text-align:left}
.row-title{
  display:block; font-size:17px; line-height:1.32; word-wrap:break-word;
  overflow-wrap:anywhere;
}
.row.done .row-title{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.row-meta{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin-top:3px; font-size:13px; color:var(--ink-2); letter-spacing:0;
}
.row-meta .dot{width:5px;height:5px;border-radius:50%;background:var(--c,var(--ink-3));flex:0 0 auto}
.row-meta .due.overdue{color:var(--danger)}
.row-meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.row-handle{
  flex:0 0 auto;width:34px;align-self:stretch;display:grid;place-items:center;
  color:var(--ink-3); touch-action:none;
}
.row-handle svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.row-sel{
  flex:0 0 auto;width:26px;height:26px;margin:13px 0 0;border-radius:50%;
  border:1.8px solid var(--ink-3); display:grid;place-items:center;
}
.row.is-selected .row-sel{background:var(--accent);border-color:var(--accent)}
.row-sel svg{width:13px;height:13px;stroke:#fff;stroke-width:2.8;fill:none;opacity:0;
  stroke-linecap:round;stroke-linejoin:round}
.row.is-selected .row-sel svg{opacity:1}
.row.is-selected{background:var(--accent-soft)}

/* group heading */
.ghead{
  display:flex;align-items:center;gap:8px;
  padding:22px var(--gut) 7px; font-size:13px;font-weight:500;color:var(--ink-2);
  letter-spacing:0;
}
.ghead button{display:flex;align-items:center;gap:6px;color:inherit;font:inherit}
.ghead svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--ease)}
.ghead.collapsed svg{transform:rotate(-90deg)}

.empty{
  padding:28px var(--gut); color:var(--ink-3); font-size:15px; letter-spacing:0;
}

/* ============================================================
   Capture bar — the hero
   ============================================================ */
.capture{
  flex:0 0 auto; position:relative;
  padding:8px var(--gut) 8px;
  background:var(--paper);
  border-top:1px solid var(--rule);
  display:flex; align-items:flex-end; gap:10px;
}
.capture-field{
  flex:1 1 auto; min-width:0;
  display:flex; align-items:center;
  background:var(--sink); border-radius:var(--r-xl);
  padding:0 6px 0 16px; min-height:48px;
  border:1.5px solid transparent;
  transition:border-color .16s linear, background .16s linear;
}
.capture.is-focus .capture-field{border-color:var(--accent);background:var(--paper)}
.capture-field input{
  flex:1 1 auto;min-width:0;height:46px;font-size:17px;caret-color:var(--accent);
  background:none;
}
.capture-field input::placeholder{color:var(--ink-3)}
.capture-send{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  background:var(--accent);display:grid;place-items:center;
  transform:scale(.6);opacity:0;pointer-events:none;
  transition:transform .18s var(--ease),opacity .14s linear;
}
.capture.has-text .capture-send{transform:scale(1);opacity:1;pointer-events:auto}
.capture-send svg{width:17px;height:17px;stroke:#fff;stroke-width:2.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.mic{
  flex:0 0 auto;width:44px;height:44px;border-radius:50%;
  background:var(--sink);display:grid;place-items:center;color:var(--ink);
  position:relative;transition:background .16s linear,color .16s linear,transform .16s var(--ease);
}
.mic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.mic:active{transform:scale(.92)}
.mic.is-live{background:var(--accent);color:#fff}
.mic.is-live::before{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:2px solid var(--accent);opacity:.45;
  animation:pulse 1.6s var(--ease) infinite;
}
.mic.is-busy{background:var(--sink-2);color:var(--ink-3)}
.mic[disabled]{opacity:.4}
@keyframes pulse{
  0%{transform:scale(.92);opacity:.5}
  70%{transform:scale(1.22);opacity:0}
  100%{transform:scale(1.22);opacity:0}
}
.speech-strip{
  padding:10px var(--gut) 2px; font-size:15px; color:var(--ink-2);
  letter-spacing:0; display:flex; gap:8px; align-items:flex-start;
}
.speech-strip b{color:var(--ink);font-weight:500}
.speech-strip .live{color:var(--ink);font-weight:400}
.speech-strip.err{color:var(--danger)}

/* ============================================================
   Bottom navigation
   ============================================================ */
.nav{
  flex:0 0 auto; display:flex; align-items:stretch;
  border-top:1px solid var(--rule); background:var(--paper);
  padding-bottom:env(safe-area-inset-bottom,0px);
  position:relative; z-index:5;
}
.nav button{
  flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; padding:7px 0 5px; color:var(--ink-3); min-height:50px;
}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.nav button span{font-size:10.5px;letter-spacing:.005em;font-weight:500}
.nav button.is-on{color:var(--accent)}
.nav .badge{
  position:absolute;top:4px;margin-left:19px;min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;
  display:grid;place-items:center;letter-spacing:0;
}

/* Quick Capture FAB */
.fab{
  position:absolute; right:var(--gut);
  bottom:calc(var(--nav-h) + 16px + var(--kb));
  width:54px;height:54px;border-radius:50%;
  background:var(--accent);box-shadow:0 6px 18px rgba(61,58,245,.34);
  display:grid;place-items:center;z-index:20;
  transition:transform .18s var(--ease),opacity .14s linear,bottom .22s var(--ease);
}
.fab svg{width:25px;height:25px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round}
.fab:active{transform:scale(.9)}
.fab.is-hidden{transform:scale(.4);opacity:0;pointer-events:none}

/* ============================================================
   Lists screen
   ============================================================ */
.tree{padding:4px 0 90px}
.tnode{
  position:relative;display:flex;align-items:center;gap:10px;
  min-height:50px;padding-right:var(--gut);margin-left:var(--gut);
  touch-action:pan-y;
}
.tnode::after{
  content:"";position:absolute;left:var(--pad,34px);right:0;bottom:0;height:1px;
  background:var(--rule);transform:scaleY(.5);transform-origin:bottom;
}
.tnode:last-child::after{opacity:0}
.tnode.is-dragging{z-index:40;box-shadow:var(--shadow-lift);border-radius:var(--r-md);background:var(--paper)}
.tnode.is-ghost{opacity:.28}
.twist{
  flex:0 0 auto;width:26px;height:44px;display:grid;place-items:center;color:var(--ink-3);
}
.twist svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--ease)}
.twist.open svg{transform:rotate(90deg)}
.tnode .swatch{
  flex:0 0 auto;width:11px;height:11px;border-radius:3.5px;background:var(--c,var(--ink-3));
}
.tnode .tname{flex:1 1 auto;min-width:0;font-size:17px;padding:13px 0;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode .tcount{flex:0 0 auto;font-size:15px;color:var(--ink-3);letter-spacing:0}
.tnode .tchev{flex:0 0 auto;color:var(--ink-3);display:grid;place-items:center;width:18px}
.tnode .tchev svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   Selection action bar
   ============================================================ */
.selbar{
  position:absolute;left:0;right:0;bottom:0;z-index:30;
  background:var(--paper);border-top:1px solid var(--rule);
  padding:8px 6px;
  display:flex;transform:translateY(110%);transition:transform .24s var(--ease);
}
.selbar.is-up{transform:translateY(0)}
.selbar button{
  flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 2px;color:var(--ink);font-size:11px;letter-spacing:0;border-radius:var(--r-sm);
}
.selbar button:active{background:var(--sink)}
.selbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.selbar button.danger{color:var(--danger)}
.selbar button[disabled]{opacity:.35}

/* ============================================================
   Sheets / modals
   ============================================================ */
.scrim{
  position:fixed;inset:0;background:rgba(16,18,24,.32);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .24s linear;
}
.scrim.is-open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--paper);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:var(--shadow-sheet);
  max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .3s var(--ease);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.sheet.is-open{transform:translateY(0)}
.sheet.tall{height:92vh}
.grabber{
  flex:0 0 auto;width:38px;height:5px;border-radius:3px;background:var(--sink-2);
  margin:8px auto 2px;
}
.sheet-head{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:6px var(--gut) 8px;min-height:46px;
}
.sheet-head h2{flex:1 1 auto;margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .textbtn{min-width:62px}
.sheet-head .textbtn:first-child{text-align:left}
.sheet-head .textbtn:last-child{text-align:right}
.sheet-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px}

/* form bits */
.field{padding:0 var(--gut)}
.field + .field{margin-top:14px}
.flabel{font-size:13px;color:var(--ink-2);letter-spacing:0;margin-bottom:6px;display:block}
.fbox{
  background:var(--sink);border-radius:var(--r-md);padding:12px 14px;
  border:1.5px solid transparent;transition:border-color .16s linear,background .16s linear;
}
.fbox:focus-within{border-color:var(--accent);background:var(--paper)}
.fbox input,.fbox textarea{width:100%;font-size:17px;background:none;resize:none}
.fbox textarea{min-height:80px;line-height:1.4}
.frow{
  display:flex;align-items:center;gap:12px;min-height:50px;
  padding:0 var(--gut);border-top:1px solid var(--rule);
}
.frow:first-of-type{border-top:0}
.frow .fk{flex:0 0 auto;font-size:16px;color:var(--ink)}
.frow .fv{flex:1 1 auto;text-align:right;font-size:16px;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow input[type=date],.frow input[type=time]{
  flex:1 1 auto;text-align:right;font-size:16px;color:var(--ink);background:none;min-width:0;
}
.frow .clear{flex:0 0 auto;color:var(--ink-3);width:26px;height:26px;display:grid;place-items:center}
.frow .clear svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}

.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:4px var(--gut) 0}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--c);
  display:grid;place-items:center;transition:transform .14s var(--ease)}
.swatches button:active{transform:scale(.88)}
.swatches button svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0;
  stroke-linecap:round;stroke-linejoin:round}
.swatches button.on svg{opacity:1}

.picklist{padding:4px 0}
.pick{
  display:flex;align-items:center;gap:10px;width:100%;min-height:48px;
  padding:0 var(--gut);text-align:left;position:relative;
}
.pick::after{content:"";position:absolute;left:var(--pad,var(--gut));right:0;bottom:0;height:1px;
  background:var(--rule);transform:scaleY(.5)}
.pick:active{background:var(--sink)}
.pick .swatch{width:11px;height:11px;border-radius:3.5px;background:var(--c,var(--ink-3));flex:0 0 auto}
.pick span{flex:1 1 auto;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .tick{color:var(--accent);opacity:0}
.pick.on .tick{opacity:1}
.pick .tick svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.pick[disabled]{opacity:.35}

/* subtasks */
.subs{padding:0 var(--gut)}
.sub{
  display:flex;align-items:center;gap:10px;min-height:42px;
  border-bottom:1px solid var(--rule);
}
.sub .check{margin:0;width:24px;height:24px}
.sub .check i{width:19px;height:19px}
.sub input{flex:1 1 auto;min-width:0;font-size:16px;padding:9px 0}
.sub.done input{color:var(--ink-3);text-decoration:line-through}
.sub .x{flex:0 0 auto;color:var(--ink-3);width:30px;height:30px;display:grid;place-items:center}
.sub .x svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.sub .grip{flex:0 0 auto;width:26px;height:34px;display:grid;place-items:center;color:var(--ink-3);
  touch-action:none}
.sub .grip svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.sub.is-dragging{background:var(--paper);box-shadow:var(--shadow-lift);border-radius:var(--r-sm);z-index:40}
.sub.is-ghost{opacity:.28}
.addsub{display:flex;align-items:center;gap:10px;min-height:42px;color:var(--ink-2)}
.addsub svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}

/* attachments */
.atts{display:flex;flex-wrap:wrap;gap:10px;padding:4px var(--gut) 0}
.att{
  position:relative;width:74px;height:74px;border-radius:var(--r-md);overflow:hidden;
  background:var(--sink);display:grid;place-items:center;
}
.att img{width:100%;height:100%;object-fit:cover}
.att .fname{font-size:10px;color:var(--ink-2);padding:4px;text-align:center;
  word-break:break-all;line-height:1.2;letter-spacing:0}
.att .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(16,18,24,.62);display:grid;place-items:center}
.att .x svg{width:11px;height:11px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.att.add{border:1.5px dashed var(--rule);background:none;color:var(--ink-3)}
.att.add svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}

/* ============================================================
   Toast
   ============================================================ */
.toast{
  position:fixed;left:12px;right:12px;z-index:200;
  bottom:calc(var(--nav-h) + 12px);
  background:#22242B;color:#fff;border-radius:var(--r-md);
  padding:13px 8px 13px 16px;display:flex;align-items:center;gap:10px;
  font-size:15px;letter-spacing:0;
  box-shadow:0 10px 30px rgba(16,18,24,.28);
  opacity:0;transform:translateY(12px);
  visibility:hidden;pointer-events:none;
  transition:transform .3s var(--ease),opacity .2s linear,visibility 0s linear .3s;
}
.toast.is-up{opacity:1;transform:none;visibility:visible;pointer-events:auto;
  transition:transform .3s var(--ease),opacity .2s linear,visibility 0s}
.toast span{flex:1 1 auto;min-width:0}
.toast button{flex:0 0 auto;color:#8F8CFF;font-weight:600;padding:6px 10px;font-size:15px}

/* ============================================================
   Search
   ============================================================ */
.searchbar{
  flex:0 0 auto;padding:2px var(--gut) 10px;display:flex;gap:10px;align-items:center;
}
.searchbox{
  flex:1 1 auto;display:flex;align-items:center;gap:8px;min-width:0;
  background:var(--sink);border-radius:var(--r-md);padding:0 12px;min-height:40px;
  border:1.5px solid transparent;transition:border-color .16s linear;
}
.searchbox:focus-within{border-color:var(--accent);background:var(--paper)}
.searchbox svg{width:17px;height:17px;stroke:var(--ink-3);stroke-width:2;fill:none;flex:0 0 auto;
  stroke-linecap:round;stroke-linejoin:round}
.searchbox input{flex:1 1 auto;min-width:0;height:38px;font-size:17px}
.crumb{font-size:13px;color:var(--ink-2);letter-spacing:0;display:flex;align-items:center;gap:5px}

/* misc */
.banner{
  margin:8px var(--gut) 0;padding:11px 13px;border-radius:var(--r-md);
  background:var(--sink);font-size:14px;color:var(--ink-2);letter-spacing:0;line-height:1.4;
  display:flex;gap:10px;align-items:flex-start;
}
.banner b{color:var(--ink);font-weight:600}
.banner button{color:var(--accent);font-weight:600;flex:0 0 auto}
.setrow{
  display:flex;align-items:center;gap:12px;width:100%;min-height:50px;
  padding:0 var(--gut);position:relative;text-align:left;
}
.setrow::after{content:"";position:absolute;left:var(--gut);right:0;bottom:0;height:1px;
  background:var(--rule);transform:scaleY(.5)}
.setrow:active{background:var(--sink)}
.setrow .k{flex:1 1 auto;font-size:17px}
.setrow .v{flex:0 0 auto;font-size:15px;color:var(--ink-3);letter-spacing:0}
.setrow.danger .k{color:var(--danger)}
.sec{padding:24px var(--gut) 6px;font-size:13px;color:var(--ink-2);letter-spacing:0}
.note{padding:10px var(--gut) 0;font-size:13px;color:var(--ink-3);letter-spacing:0;line-height:1.45}
.wordmark{display:flex;align-items:center;gap:9px}
.wordmark .mk{width:26px;height:26px;border-radius:7px;flex:0 0 auto;
  background:#0E3FA8 url(icon.png) center/cover no-repeat}
.wordmark .mk svg{display:none}

/* ============================================================
   Layout fixes + states
   ============================================================ */
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.check{position:relative}
.fab{bottom:16px}
.screen:not(.is-pushed).is-active ~ .fab{}
body.kb-open .nav{display:none}
body.kb-open .fab{opacity:0;pointer-events:none}
.sheet{bottom:var(--kb)}
.pick.danger span{color:var(--danger)}
.tnode .row-handle{align-self:center;height:44px}
.row-meta > svg{margin-right:-2px}
.att .fname{pointer-events:none}
.capture-field textarea{background:none}
#task-body .sub .check{margin:0}
.title-sub:empty{display:none}
.capture{cursor:pointer}
.row-more{flex:0 0 auto;width:36px;align-self:stretch;display:grid;place-items:center;color:var(--ink-3)}
.row-more svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.row-more:active{color:var(--ink)}
.addrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;
  padding:0 var(--gut);color:var(--accent);font-size:17px;text-align:left}
.addrow:active{background:var(--sink)}
.addrow svg,.pick.newlist svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;flex:0 0 auto}
.pick.newlist{color:var(--accent)}
.pick.newlist span{color:var(--accent)}
</style>

  for(var i=0;i<PALETTE.length;i++) if(PALETTE[i].id===id) return PALETTE[i].hex;

    .getRandomValues(b);

  var h=[],i;
  for(i=0;i<16;i++) h.push((b[i]+0x100).toString(16).slice(1));
  return h.slice(0,4).join('')+'-'+h.slice(4,6).join('')+'-'+h.slice(6,8).join('')+'-'+
         h.slice(8,10).join('')+'-'+h.slice(10,16).join('');

    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function $(id){ return document.getElementById(id); }
function el(tag, cls, html){

  d = d || new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseKey(k){
  var p = String(k||'').split('-');
  return new Date(+p[0], (+p[1])-1, +p[2]);
}
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dueLabel(key){
  if(!key) return '';
  var t = dateKey(), d = parseKey(key), td = parseKey(t);
  var diff = Math.round((d - td)/86400000);
  if(diff===0) return 'Today';
  if(diff===1) return 'Tomorrow';
  if(diff===-1) return 'Yesterday';
  var s = DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()];
  if(d.getFullYear()!==td.getFullYear()) s += ' '+d.getFullYear();

}
function timeLabel(t){
  if(!t) return '';
  var p=String(t).split(':'), h=+p[0], m=p[1]||'00';
  var ap = h>=12?'pm':'am', hh = h%12; if(hh===0) hh=12;

function plural(n, one, many){ return n+' '+(n===1?one:(many||one+'s')); }

function normUrl(s){
  s = String(s||'').trim();
  if(!s) return '';

  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(0)+' KB';

/* ============================================================
   2. INDEXEDDB — schema + safe additive migrations
   ------------------------------------------------------------

var db = null;

      t.createIndex('byDue',['completed','dueDate']);
      t.createIndex('updatedAt','updatedAt');
      t.createIndex('deleted','deleted');

      var s = dbi.createObjectStore('subtasks', {keyPath:'id'});
      s.createIndex('byTaskPos',['taskId','position']);
      s.createIndex('taskId','taskId');

      var a = dbi.createObjectStore('attachments', {keyPath:'id'});
      a.createIndex('taskId','taskId');

      dbi.createObjectStore('meta', {keyPath:'key'});
      dbi.createObjectStore('snapshots', {keyPath:'id'});
    }
    /* falls through */
    /* case 1: { ...additive changes for DB_VERSION 2... } */
    /* falls through */
  }
}

function snapshotBefore(tx, oldVersion, done){
  /* copy current data into snapshots store so a bad migration is recoverable */
  var names = ['containers','tasks','subtasks','meta'];
  var bag = {}, pending = 0, started = false;
  names.forEach(function(n){
    if(!tx.db.objectStoreNames.contains(n)) return;
    pending++; started = true;
    var out = [];
    var req = tx.objectStore(n).openCursor();
    req.onsuccess = function(e){
      var cur = e.target.result;
      if(cur){ out.push(cur.value); cur.continue(); }
      else {
        bag[n] = out; pending--;
        if(pending===0) write();
      }
    };
    req.onerror = function(){ pending--; if(pending===0) write(); };
  });
  if(!started){ done(); return; }
  function write(){
    try{
      if(tx.db.objectStoreNames.contains('snapshots')){
        var st = tx.objectStore('snapshots');
        st.put({id:'pre-v'+oldVersion+'-'+now(), takenAt:now(), fromVersion:oldVersion, data:bag});
        /* keep only the two most recent snapshots */
        var keys = [];
        st.openCursor().onsuccess = function(e){
          var c = e.target.result;
          if(c){ keys.push(c.key); c.continue(); }
          else { keys.sort(); while(keys.length>2) st.delete(keys.shift()); }
        };
      }
    }catch(err){ /* snapshot is best-effort, never blocks the upgrade */ }
    done();
  }
}

function openDB(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e){
      var dbi = e.target.result, tx = e.target.transaction, oldV = e.oldVersion;
      if(oldV > 0){
        snapshotBefore(tx, oldV, function(){ migrate(dbi, tx, oldV); });
      } else {
        migrate(dbi, tx, oldV);
      }
    };
    req.onsuccess = function(e){
      db = e.target.result;
      db.onversionchange = function(){ try{ db.close(); }catch(x){} };
      resolve(db);
    };
    req.onerror = function(){ reject(req.error); };
    req.onblocked = function(){ /* another tab holds the old version */ };
  });
}

function txStore(name, mode){ return db.transaction(name, mode||'readonly').objectStore(name); }

function idbAll(name){
  return new Promise(function(res, rej){
    var out=[], req = txStore(name).openCursor();
    req.onsuccess = function(e){
      var c = e.target.result;
      if(c){ out.push(c.value); c.continue(); } else res(out);
    };
    req.onerror = function(){ rej(req.error); };
  });
}
function idbPut(name, rec){
  return new Promise(function(res, rej){
    var tx = db.transaction(name,'readwrite');
    tx.objectStore(name).put(rec);
    tx.oncomplete = function(){ res(rec); };
    tx.onerror = function(){ rej(tx.error); };
  });
}
function idbPutMany(names, recsByStore){
  return new Promise(function(res, rej){
    var tx = db.transaction(names,'readwrite');
    Object.keys(recsByStore).forEach(function(n){
      var st = tx.objectStore(n);
      recsByStore[n].forEach(function(r){ st.put(r); });
    });
    tx.oncomplete = function(){ res(); };
    tx.onerror = function(){ rej(tx.error); };
  });
}
function idbDel(name, key){
  return new Promise(function(res, rej){
    var tx = db.transaction(name,'readwrite');
    tx.objectStore(name).delete(key);
    tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); };
  });
}

/* fire-and-forget write; IndexedDB is the source of truth, UI never waits */
var writeErrors = 0;
function persist(name, rec){
  idbPut(name, rec)['catch'](function(err){
    writeErrors++;
    console.error('Do It! write failed', name, err);
    if(writeErrors===1) toast('Could not save to this device. Export a backup.', null);
  });
}
function persistDel(name, key){
  idbDel(name, key)['catch'](function(err){ console.error('delete failed', err); });
}

/* ============================================================
   3. IN-MEMORY STATE (working copy of the database)
   ============================================================ */
var S = {
  containers: {},
  tasks: {},
  subtasks: {},
  attachments: {},
  meta: {}
};

function metaGet(k, dflt){ return S.meta[k]===undefined ? dflt : S.meta[k]; }
function metaSet(k, v){ S.meta[k]=v; persist('meta', {key:k, value:v}); }

function loadAll(){
  return Promise.all([
    idbAll('containers'), idbAll('tasks'), idbAll('subtasks'),
    idbAll('attachments'), idbAll('meta')
  ]).then(function(r){
    r[0].forEach(function(c){ S.containers[c.id]=c; });
    r[1].forEach(function(t){ S.tasks[t.id]=t; });
    r[2].forEach(function(s){ S.subtasks[s.id]=s; });
    r[3].forEach(function(a){ S.attachments[a.id]=a; });
    r[4].forEach(function(m){ S.meta[m.key]=m.value; });
  });
}

/* ---- record factories ---- */
function newContainer(name, parentId, colour){
  var t = now();
  return {
    id:uid(), parentId:parentId||ROOT, name:name||'New list',
    colour:colour||'slate', position:nextPos(siblings(parentId||ROOT)),
    createdAt:t, updatedAt:t, deleted:0
  };
}
function newTask(title, containerId){
  var t = now(), cid = containerId||INBOX;
  return {
    id:uid(), containerId:cid, title:String(title||'').trim(),
    notes:'', linkUrl:'', dueDate:'', dueTime:'',
    position:nextPos(tasksIn(cid,0)), completed:0, completedAt:0,
    createdAt:t, updatedAt:t, deleted:0
  };
}
function newSubtask(taskId, title){
  var t = now();
  return {
    id:uid(), taskId:taskId, title:String(title||'').trim(),
    position:nextPos(subtasksOf(taskId)), completed:0,
    createdAt:t, updatedAt:t, deleted:0
  };
}

/* ---- ordering ---- */
function nextPos(list){
  var max = 0;
  list.forEach(function(r){ if(r.position>max) max=r.position; });
  return max + POS_GAP;
}
function posBetween(before, after){
  if(before==null && after==null) return POS_GAP;
  if(before==null) return after.position - POS_GAP;
  if(after==null)  return before.position + POS_GAP;
  var mid = (before.position + after.position)/2;
  if(Math.abs(after.position - before.position) < 0.0001) return null; /* caller renormalises */
  return mid;
}
function renormalise(list, save){
  list.forEach(function(r,i){
    r.position = (i+1)*POS_GAP; r.updatedAt = now();
    if(save) save(r);
  });
}

/* ---- selectors ---- */
function byPos(a,b){ return a.position - b.position || a.createdAt - b.createdAt; }
function siblings(parentId){
  var out=[];
  for(var k in S.containers){
    var c=S.containers[k];
    if(!c.deleted && c.parentId===parentId) out.push(c);
  }
  return out.sort(byPos);
}
function tasksIn(containerId, completed){
  var out=[];
  for(var k in S.tasks){
    var t=S.tasks[k];
    if(!t.deleted && t.containerId===containerId && t.completed===(completed?1:0)) out.push(t);
  }
  if(completed) return out.sort(function(a,b){ return b.completedAt - a.completedAt; });
  return out.sort(byPos);
}
function subtasksOf(taskId){
  var out=[];
  for(var k in S.subtasks){
    var s=S.subtasks[k];
    if(!s.deleted && s.taskId===taskId) out.push(s);
  }
  return out.sort(byPos);
}
function attachmentsOf(taskId){
  var out=[];
  for(var k in S.attachments){
    var a=S.attachments[k];
    if(!a.deleted && a.taskId===taskId) out.push(a);
  }
  return out.sort(function(a,b){ return a.createdAt-b.createdAt; });
}
function containerPath(id){
  if(id===INBOX) return ['Inbox'];
  var out=[], guard=0, c=S.containers[id];
  while(c && guard++<50){ out.unshift(c.name); c = c.parentId===ROOT?null:S.containers[c.parentId]; }
  return out;
}
function containerLabel(id){ return id===INBOX ? 'Inbox' : containerPath(id).join(' › '); }
function containerColour(id){
  if(id===INBOX) return '';
  var c=S.containers[id];
  return c ? colourHex(c.colour) : '';
}
function descendants(id){
  var out=[], stack=[id], guard=0;
  while(stack.length && guard++<5000){
    var cur = stack.pop();
    siblings(cur).forEach(function(c){ out.push(c); stack.push(c.id); });
  }
  return out;
}
function wouldLoop(moverId, targetParentId){
  if(targetParentId===ROOT) return false;
  if(moverId===targetParentId) return true;
  var guard=0, c=S.containers[targetParentId];
  while(c && guard++<200){
    if(c.id===moverId) return true;
    c = c.parentId===ROOT?null:S.containers[c.parentId];
  }
  return false;
}
function countIn(containerId){
  return tasksIn(containerId,0).length;
}
function todayTasks(){
  var key = dateKey(), due=[], over=[];
  for(var k in S.tasks){
    var t=S.tasks[k];
    if(t.deleted || t.completed || !t.dueDate) continue;
    if(t.dueDate===key) due.push(t);
    else if(t.dueDate < key) over.push(t);
  }
  function srt(a,b){
    var at=a.dueTime||'99:99', bt=b.dueTime||'99:99';
    if(at!==bt) return at<bt?-1:1;
    return a.position-b.position;
  }
  return {due:due.sort(srt), overdue:over.sort(function(a,b){
    return a.dueDate<b.dueDate?-1:a.dueDate>b.dueDate?1:srt(a,b);
  })};
}

/* ============================================================
   4. VIEWPORT + KEYBOARD
   iOS does not shrink the layout viewport when the keyboard
   opens, so we drive the shell from visualViewport instead.
   ============================================================ */
var appEl, kbHeight = 0;
function syncViewport(){
  var vv = window.visualViewport;
  if(!vv || !appEl) return;
  var kb = Math.max(0, (window.innerHeight - vv.height - vv.offsetTop));
  kbHeight = kb < 60 ? 0 : kb;           /* ignore toolbars / rubber-banding */
  appEl.style.height = vv.height + 'px';
  appEl.style.bottom = 'auto';
  appEl.style.top = vv.offsetTop + 'px';
  document.documentElement.style.setProperty('--kb', kbHeight + 'px');
  document.body.classList.toggle('kb-open', kbHeight > 0);
  if(toastEl && toastEl.classList.contains('is-up')) placeToast();
}
function initViewport(){
  appEl = $('app');
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', syncViewport);
    window.visualViewport.addEventListener('scroll', syncViewport);
  }
  window.addEventListener('orientationchange', function(){ setTimeout(syncViewport, 240); });
  syncViewport();
}

/* ============================================================
   5. TOAST + UNDO
   The toast is invisible AND untouchable when hidden
   (visibility + pointer-events), and when shown it sits above
   whatever is at the bottom of the screen right now.
   ============================================================ */
var toastEl, toastTextEl, toastUndoEl, toastTimer = null, toastFn = null;
function placeToast(){
  if(!toastEl || !appEl) return;
  var appR = appEl.getBoundingClientRect();
  var top = appR.bottom;
  function consider(node){
    if(!node) return;
    var r = node.getBoundingClientRect();
    if(r.height > 0 && r.width > 0 && r.top < top) top = r.top;
  }
  var nav = $('nav');
  if(nav && getComputedStyle(nav).display !== 'none') consider(nav);
  if(curTab === 'inbox' && !stack.length) consider($('capture'));
  if($('selbar').classList.contains('is-up')) consider($('selbar'));
  if(!$('fab').classList.contains('is-hidden')) consider($('fab'));
  toastEl.style.bottom = Math.round(kbHeight + (appR.bottom - top) + 10) + 'px';
}
function toast(text, undoFn){
  if(!toastEl) return;
  clearTimeout(toastTimer);
  toastFn = undoFn || null;
  toastTextEl.textContent = text;
  toastUndoEl.classList.toggle('hidden', !toastFn);
  placeToast();
  toastEl.classList.add('is-up');
  toastTimer = setTimeout(hideToast, TOAST_MS);
}
function keepToastPlaced(){
  if(toastEl && toastEl.classList.contains('is-up')) placeToast();
}
function hideToast(){
  clearTimeout(toastTimer);
  toastFn = null;
  if(toastEl) toastEl.classList.remove('is-up');
}
/* Snapshot records before a destructive change; returns the undo function. */
function restoreInto(live, src){
  /* mutate in place so anything already holding this object stays valid */
  var k;
  for(k in live){ if(!(k in src)) delete live[k]; }
  for(k in src){ live[k] = src[k]; }
  return live;
}
function snap(list){
  var before = list.map(function(r){ return {store:r.store, rec:clone(r.rec)}; });
  return function(){
    var byStore = {};
    before.forEach(function(b){
      var live = S[b.store][b.rec.id];
      var rec = live ? restoreInto(live, b.rec) : (S[b.store][b.rec.id] = b.rec);
      (byStore[b.store] = byStore[b.store] || []).push(rec);
    });
    idbPutMany(Object.keys(byStore), byStore)['catch'](function(e){ console.error(e); });
    renderAll();
  };
}
function snapTasks(tasks){
  return snap(tasks.map(function(t){ return {store:'tasks', rec:t}; }));
}

/* ============================================================
   6. NAVIGATION
   Tabs are always reachable; pushed screens stack in the order
   opened (z-index follows depth). No browser history: iOS
   Home Screen apps have no back gesture, so in-app Back is the
   single source of truth.
   ============================================================ */
var curTab = 'inbox', stack = [];
var SCREEN = {inbox:'sc-inbox', today:'sc-today', lists:'sc-lists', search:'sc-search'};

function inStack(name){
  for(var i=0;i<stack.length;i++) if(stack[i].name===name) return true;
  return false;
}
function topScreen(){ return stack.length ? stack[stack.length-1] : null; }
function updateFab(){
  /* Inbox has its own capture bar and Search its own field */
  var hide = !!stack.length || sel.on || curTab==='inbox' || curTab==='search';
  $('fab').classList.toggle('is-hidden', hide);
}
function clearStack(){
  stack.forEach(function(s){ $('sc-'+s.name).classList.remove('is-active'); });
  stack = [];
}
function showTab(tab){
  if(sel.on) exitSelect();
  clearStack();
  curTab = tab;
  Object.keys(SCREEN).forEach(function(t){
    $(SCREEN[t]).classList.toggle('is-active', t===tab);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b){
    b.classList.toggle('is-on', b.dataset.tab===tab);
  });
  updateFab();
  renderTab(tab);
  updateBadges();
  keepToastPlaced();
  if(tab!=='inbox') blurCapture();
  /* focus only inside the user's own tap, so iOS really opens the keyboard */
  if(tab==='search') focusField('search-input');
}
function push(name, id){
  if(sel.on) exitSelect();
  stack.push({name:name, id:id});
  var scr = $('sc-'+name);
  scr.style.zIndex = String(10 + stack.length);
  scr.classList.add('is-active');
  blurCapture();
  updateFab();
  keepToastPlaced();
}
function pop(){
  var top = stack.pop();
  if(!top) return false;
  if(sel.on) exitSelect();
  var next = topScreen();
  if(top.name === 'list' && next && next.name === 'list'){
    curList = next.id;                       /* back up to the parent list */
    renderListScreen();
  } else if(!inStack(top.name)){
    $('sc-'+top.name).classList.remove('is-active');
    if(top.name === 'list') curList = null;
  }
  updateFab();
  renderTab(curTab);
  keepToastPlaced();
  return true;
}
function goBack(){
  if(anySheetOpen()){ closeTopSheet(); return; }
  pop();
}
function focusField(id){
  var f = $(id);
  if(!f) return;
  try{ f.focus({preventScroll:true}); }catch(e){ try{ f.focus(); }catch(x){} }
}

/* ============================================================
   7. SELECTION MODE
   ============================================================ */
var sel = {on:false, ids:{}, scope:null};
function selCount(){ return Object.keys(sel.ids).length; }
function setSelectLabels(){
  ['inbox-select','today-select','list-select'].forEach(function(id){
    var b = $(id);
    if(b) b.textContent = sel.on ? 'Done' : 'Select';
  });
}
function enterSelect(scope, firstId){
  sel.on = true; sel.scope = scope; sel.ids = {};
  if(firstId) sel.ids[firstId] = 1;
  $('selbar').classList.add('is-up');
  blurCapture();
  setSelectLabels();
  updateFab();
  renderAll();
  updateSelbar();
}
function exitSelect(){
  sel.on = false; sel.ids = {}; sel.scope = null;
  $('selbar').classList.remove('is-up');
  setSelectLabels();
  updateFab();
  renderAll();
  if(toastEl && toastEl.classList.contains('is-up')) placeToast();
}
function toggleSel(id){
  if(sel.ids[id]) delete sel.ids[id]; else sel.ids[id] = 1;
  renderAll();
  updateSelbar();
}
function updateSelbar(){
  var n = selCount(), none = n===0;
  Array.prototype.forEach.call($('selbar').querySelectorAll('button'), function(b){
    b.disabled = none;
  });
  var sub = $(sel.scope==='today' ? 'today-sub' : sel.scope==='list' ? 'list-sub' : 'inbox-sub');
  if(sub) sub.textContent = n ? n+' selected' : 'Tap tasks to select them';
}
function selectedTasks(){
  var out = [];
  for(var id in sel.ids){ if(S.tasks[id] && !S.tasks[id].deleted) out.push(S.tasks[id]); }
  return out;
}

/* ============================================================
   8. DRAG TO REORDER (Pointer Events — HTML5 DnD is unusable on iOS)
   ============================================================ */
function attachDrag(cfg){
  /* cfg: {scroller, container, itemSel, handleSel, onDrop(oldIndex,newIndex)} */
  var items = null, rects = null, dragEl = null, dragIdx = -1, targetIdx = -1;
  var startY = 0, dy = 0, scrollStart = 0, raf = 0, autoDir = 0, pid = null, ids = [];

  cfg.container.addEventListener('pointerdown', onDown);

  function onDown(e){
    if(sel.on) return;
    var handle = e.target.closest ? e.target.closest(cfg.handleSel) : null;
    if(!handle || !cfg.container.contains(handle)) return;
    var item = handle.closest(cfg.itemSel);
    if(!item) return;
    e.preventDefault();
    pid = e.pointerId;
    begin(item, e.clientY);
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }
  function begin(item, y){
    items = Array.prototype.slice.call(cfg.container.querySelectorAll(cfg.itemSel));
    ids = items.map(function(n){ return n.dataset.id || n.dataset.node || n.dataset.sub || ''; });
    rects = items.map(function(n){ return n.getBoundingClientRect(); });
    dragEl = item; dragIdx = items.indexOf(item); targetIdx = dragIdx;
    startY = y; dy = 0;
    scrollStart = cfg.scroller ? cfg.scroller.scrollTop : 0;
    dragEl.classList.add('is-dragging');
    if(navigator.vibrate) { try{ navigator.vibrate(8); }catch(x){} }
  }
  function onMove(e){
    if(dragIdx < 0 || e.pointerId !== pid) return;
    e.preventDefault();
    var scrolled = cfg.scroller ? (cfg.scroller.scrollTop - scrollStart) : 0;
    dy = (e.clientY - startY) + scrolled;
    place();
    edgeScroll(e.clientY);
  }
  function place(){
    dragEl.style.transform = 'translateY(' + dy + 'px)';
    var h = rects[dragIdx].height;
    var centre = rects[dragIdx].top + rects[dragIdx].height/2 + dy;
    var idx = dragIdx;
    var i;
    for(i=0;i<rects.length;i++){
      if(i===dragIdx) continue;
      var c = rects[i].top + rects[i].height/2;
      if(i < dragIdx && centre < c){ idx = Math.min(idx, i); }
      if(i > dragIdx && centre > c){ idx = Math.max(idx, i); }
    }
    targetIdx = idx;
    for(i=0;i<items.length;i++){
      if(i===dragIdx) continue;
      var shift = 0;
      if(targetIdx > dragIdx && i > dragIdx && i <= targetIdx) shift = -h;
      else if(targetIdx < dragIdx && i < dragIdx && i >= targetIdx) shift = h;
      items[i].style.transform = shift ? 'translateY('+shift+'px)' : '';
      items[i].style.transition = 'transform .18s var(--ease)';
    }
  }
  function edgeScroll(clientY){
    if(!cfg.scroller){ return; }
    var box = cfg.scroller.getBoundingClientRect();
    var dir = 0;
    if(clientY < box.top + 64) dir = -1;
    else if(clientY > box.bottom - 64) dir = 1;
    if(dir === autoDir) return;
    autoDir = dir;
    cancelAnimationFrame(raf);
    if(!dir) return;
    (function step(){
      if(!autoDir || dragIdx < 0) return;
      cfg.scroller.scrollTop += autoDir * 9;
      dy = (dy) + autoDir * 0;
      place();
      raf = requestAnimationFrame(step);
    })();
  }
  function onUp(e){
    if(e && e.pointerId !== pid) return;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    autoDir = 0; cancelAnimationFrame(raf);
    if(dragIdx < 0) return;
    items.forEach(function(n){ n.style.transform=''; n.style.transition=''; });
    dragEl.classList.remove('is-dragging');
    var from = dragIdx, to = targetIdx;
    dragIdx = -1; dragEl = null; items = null;
    if(from !== to && to >= 0) cfg.onDrop(from, to, ids);
  }
}

/* Apply a reorder to a sorted record array and persist new positions. */
function applyReorder(list, from, to, store){
  var moved = list[from];
  if(!moved) return;
  var rest = list.slice();
  rest.splice(from,1);
  var before = rest[to-1] || null;
  var after  = rest[to]   || null;
  var p = posBetween(before, after);
  if(p === null){
    rest.splice(to,0,moved);
    renormalise(rest, function(r){ persist(store, r); });
  } else {
    moved.position = p; moved.updatedAt = now();
    persist(store, moved);
  }
}

/* ============================================================
   9. LONG PRESS → selection mode
   Rows are mostly buttons, so the press is allowed to start on
   the task text; only the checkbox, menu and drag handle are
   excluded. The tap that ends a long press is swallowed so it
   does not immediately un-select the row.
   ============================================================ */
var suppressClickUntil = 0;
function attachLongPress(container, itemSel, onLong){
  var timer = null, sx = 0, sy = 0, target = null;
  container.addEventListener('pointerdown', function(e){
    if(sel.on) return;
    if(e.target.closest('.check, .row-more, .row-handle, .grip, input, textarea, a, [data-purge]')) return;
    target = e.target.closest(itemSel);
    if(!target || !target.dataset.id){ target = null; return; }
    sx = e.clientX; sy = e.clientY;
    clearTimeout(timer);
    timer = setTimeout(function(){
      if(!target) return;
      var hit = target; target = null;
      suppressClickUntil = Date.now() + 700;
      if(navigator.vibrate){ try{ navigator.vibrate(10); }catch(x){} }
      onLong(hit);
    }, LONGPRESS_MS);
  });
  container.addEventListener('pointermove', function(e){
    if(!target) return;
    if(Math.abs(e.clientX-sx) > 9 || Math.abs(e.clientY-sy) > 9){
      clearTimeout(timer); target = null;
    }
  });
  ['pointerup','pointercancel'].forEach(function(ev){
    container.addEventListener(ev, function(){ clearTimeout(timer); target = null; }, true);
  });
  container.addEventListener('contextmenu', function(e){
    if(e.target.closest(itemSel)) e.preventDefault();
  });
}
document.addEventListener('click', function(e){
  if(Date.now() < suppressClickUntil){
    suppressClickUntil = 0;
    e.stopPropagation();
    e.preventDefault();
  }
}, true);

/* ============================================================
   10. RENDERING
   ============================================================ */
function svgi(name, cls){
  return '<svg'+(cls?' class="'+cls+'"':'')+'><use href="#i-'+name+'"></use></svg>';
}
function collapsed(key){
  var m = metaGet('collapse', {});
  return !!m[key];
}
function toggleCollapse(key){
  var m = metaGet('collapse', {});
  m[key] = !m[key];
  metaSet('collapse', m);
  renderAll();
}

function metaBits(t, showList){
  var bits = [];
  if(showList && t.containerId !== INBOX){
    var c = S.containers[t.containerId];
    if(c) bits.push('<span class="dot" style="--c:'+colourHex(c.colour)+'"></span>'+esc(c.name));
  } else if(showList){
    bits.push('Inbox');
  }
  if(t.dueDate){
    var over = t.dueDate < dateKey();
    bits.push('<span class="due'+(over?' overdue':'')+'">'+esc(dueLabel(t.dueDate)) +
              (t.dueTime ? ' · '+esc(timeLabel(t.dueTime)) : '') + '</span>');
  }
  var subs = subtasksOf(t.id);
  if(subs.length){
    var done = subs.filter(function(s){ return s.completed; }).length;
    bits.push(svgi('done')+done+'/'+subs.length);
  }
  if(t.notes) bits.push(svgi('note'));
  if(t.linkUrl) bits.push(svgi('link'));
  var at = attachmentsOf(t.id);
  if(at.length) bits.push(svgi('clip')+at.length);
  return bits.length ? '<span class="row-meta">'+bits.join('')+'</span>' : '';
}

function taskRow(t, opt){
  opt = opt || {};
  var selected = sel.on && sel.ids[t.id];
  var cls = 'row' + (t.completed?' done':'') + (selected?' is-selected':'') + (opt.drag&&!sel.on?' re':'');
  var lead;
  if(sel.on){
    lead = '<button class="row-sel" data-sel="'+t.id+'" aria-label="Select">'+svgi('check')+'</button>';
  } else {
    lead = '<button class="check" data-check="'+t.id+'" aria-label="Complete"><i></i>'+svgi('check')+'</button>';
  }
  var accent = '';
  if(opt.accent){
    var hex = containerColour(t.containerId);
    if(hex) accent = '<span class="row-accent" style="--c:'+hex+'"></span>';
  }
  var handle = (opt.drag && !sel.on) ? '<span class="row-handle" data-drag>'+svgi('grip')+'</span>' : '';
  var trail = opt.trash ? '<button class="iconbtn small" data-purge="'+t.id+'" aria-label="Delete permanently">'+svgi('trash')+'</button>' : '';
  var more = (!sel.on && !t.completed && !opt.trash) ? '<button class="row-more" data-more="'+t.id+'" aria-label="Task actions">'+svgi('more')+'</button>' : '';
  return '<li class="'+cls+'" data-id="'+t.id+'">'+accent+lead+
    '<button class="row-main" data-open="'+t.id+'"><span class="row-title">'+esc(t.title||'Untitled')+'</span>'+
    metaBits(t, !!opt.showList)+'</button>'+trail+more+handle+'</li>';
}

function groupHead(key, label, count){
  var c = collapsed(key);
  return '<li class="ghead'+(c?' collapsed':'')+'"><button data-collapse="'+esc(key)+'">'+
    svgi('down')+esc(label)+' ('+count+')</button></li>';
}

/* ---------- Inbox ---------- */
function renderInbox(){
  var active = tasksIn(INBOX,0), done = tasksIn(INBOX,1);
  var html = '';
  if(!active.length && !done.length){
    html = '<li class="empty">Nothing here yet. Type below and it is saved instantly.</li>';
  } else {
    active.forEach(function(t){ html += taskRow(t, {drag:true}); });
    if(done.length){
      html += groupHead('inbox-done','Completed', done.length);
      if(!collapsed('inbox-done')) done.forEach(function(t){ html += taskRow(t, {}); });
    }
  }
  $('inbox-rows').innerHTML = html;
  $('inbox-sub').textContent = active.length ? plural(active.length,'thing')+' to sort out' : '';
}

/* ---------- Today ---------- */
function renderToday(){
  var tv = todayTasks(), html = '';
  if(tv.overdue.length){
    html += groupHead('today-over','Overdue', tv.overdue.length);
    if(!collapsed('today-over')) tv.overdue.forEach(function(t){ html += taskRow(t,{showList:true, accent:true}); });
  }
  if(tv.due.length){
    if(tv.overdue.length) html += groupHead('today-due','Today', tv.due.length);
    if(!tv.overdue.length || !collapsed('today-due'))
      tv.due.forEach(function(t){ html += taskRow(t,{showList:true, accent:true}); });
  }
  if(!html) html = '<li class="empty">Nothing due today. Tap + Add to plan something.</li>';
  $('today-rows').innerHTML = html;
  var d = new Date();
  $('today-sub').textContent = DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()];
}

/* ---------- Lists ---------- */
function treeNode(c, depth){
  var kids = siblings(c.id);
  var open = !collapsed('node-'+c.id);
  var pad = 16 + depth*18;
  var html = '<div class="tnode" data-node="'+c.id+'" style="--pad:'+(pad+20)+'px;padding-left:'+(depth*18)+'px">';
  html += kids.length
    ? '<button class="twist'+(open?' open':'')+'" data-collapse="node-'+c.id+'">'+svgi('right')+'</button>'
    : '<span class="twist"></span>';
  html += '<span class="swatch" style="--c:'+colourHex(c.colour)+'"></span>';
  html += '<button class="tname" data-list="'+c.id+'">'+esc(c.name)+'</button>';
  var n = countIn(c.id);
  html += '<span class="tcount">'+(n||'')+'</span>';
  html += '<span class="row-handle" data-drag>'+svgi('grip')+'</span>';
  html += '<span class="tchev">'+svgi('right')+'</span>';
  html += '</div>';
  if(open && kids.length) kids.forEach(function(k){ html += treeNode(k, depth+1); });
  return html;
}
function renderLists(){
  var roots = siblings(ROOT), html = '';
  html += '<div class="tnode" data-node="inbox" style="--pad:36px">'+
    '<span class="twist"></span><span class="swatch" style="--c:var(--accent)"></span>'+
    '<button class="tname" data-list="'+INBOX+'">Inbox</button>'+
    '<span class="tcount">'+(countIn(INBOX)||'')+'</span><span class="tchev">'+svgi('right')+'</span></div>';
  if(!roots.length){
    html += '<div class="empty">No lists yet.</div>';
  } else {
    roots.forEach(function(c){ html += treeNode(c, 0); });
  }
  html += '<button class="addrow" data-newlist>'+svgi('plus')+'<span>New list</span></button>';
  $('lists-tree').innerHTML = html;
}

/* ---------- List detail ---------- */
var curList = null;
function renderListScreen(){
  if(!curList) return;
  var c = curList===INBOX ? null : S.containers[curList];
  if(curList!==INBOX && (!c || c.deleted)){ pop(); return; }
  $('list-title').textContent = curList===INBOX ? 'Inbox' : c.name;
  var path = curList===INBOX ? [] : containerPath(curList).slice(0,-1);
  $('list-sub').textContent = path.join(' › ');
  $('list-more').classList.toggle('hidden', curList===INBOX);

  var kids = curList===INBOX ? [] : siblings(curList);
  var active = tasksIn(curList,0), done = tasksIn(curList,1);
  var html = '';
  if(kids.length){
    html += '<div class="tree" style="padding-bottom:0">';
    kids.forEach(function(k){
      html += '<div class="tnode" data-node="'+k.id+'" style="--pad:36px">'+
        '<span class="twist"></span><span class="swatch" style="--c:'+colourHex(k.colour)+'"></span>'+
        '<button class="tname" data-list="'+k.id+'">'+esc(k.name)+'</button>'+
        '<span class="tcount">'+(countIn(k.id)||'')+'</span>'+
        '<span class="tchev">'+svgi('right')+'</span></div>';
    });
    html += '</div>';
  }
  html += '<ul class="rows" id="list-rows">';
  if(!active.length && !done.length && !kids.length){
    html += '<li class="empty">Nothing to do here yet.</li>';
  }
  active.forEach(function(t){ html += taskRow(t, {drag:true}); });
  if(done.length){
    html += groupHead('list-done-'+curList,'Completed', done.length);
    if(!collapsed('list-done-'+curList)) done.forEach(function(t){ html += taskRow(t, {}); });
  }
  html += '</ul>';
  $('list-body').innerHTML = html;
}

/* ---------- Completed history ---------- */
function renderDone(){
  var out = [];
  for(var k in S.tasks){
    var t = S.tasks[k];
    if(!t.deleted && t.completed) out.push(t);
  }
  out.sort(function(a,b){ return b.completedAt - a.completedAt; });
  var html = out.length
    ? out.map(function(t){ return taskRow(t, {showList:true, trash:true}); }).join('')
    : '<li class="empty">Nothing completed yet.</li>';
  $('done-rows').innerHTML = html;
  $('done-sub').textContent = out.length ? plural(out.length,'task')+' done' : '';
}

/* ---------- Search ---------- */
function renderSearch(){
  var q = ($('search-input').value||'').trim().toLowerCase();
  var box = $('search-results');
  if(!q){ box.innerHTML = '<div class="empty">Search tasks, notes and lists.</div>'; return; }
  var lists = [], active = [], done = [], k, t;
  for(k in S.containers){
    var c = S.containers[k];
    if(!c.deleted && c.name.toLowerCase().indexOf(q) > -1) lists.push(c);
  }
  for(k in S.tasks){
    t = S.tasks[k];
    if(t.deleted) continue;
    var hay = (t.title+' '+(t.notes||'')).toLowerCase();
    var hit = hay.indexOf(q) > -1;
    if(!hit){
      hit = subtasksOf(t.id).some(function(s){ return s.title.toLowerCase().indexOf(q) > -1; });
    }
    if(!hit) continue;
    (t.completed ? done : active).push(t);
  }
  var html = '';
  if(lists.length){
    html += '<ul class="rows">'+groupHead('s-lists','Lists', lists.length);
    lists.sort(byPos).forEach(function(c){
      html += '<li class="row" data-id="'+c.id+'"><span class="row-accent" style="--c:'+colourHex(c.colour)+'"></span>'+
        '<button class="row-main" data-list="'+c.id+'"><span class="row-title">'+esc(c.name)+'</span>'+
        '<span class="row-meta">'+esc(containerPath(c.id).slice(0,-1).join(' › ') || 'Top level')+
        ' · '+plural(countIn(c.id),'task')+'</span></button></li>';
    });
    html += '</ul>';
  }
  if(active.length){
    html += '<ul class="rows">'+groupHead('s-tasks','Tasks', active.length);
    active.forEach(function(t){ html += taskRow(t, {showList:true, accent:true}); });
    html += '</ul>';
  }
  if(done.length){
    html += '<ul class="rows">'+groupHead('s-done','Completed', done.length);
    if(!collapsed('s-done')) done.forEach(function(t){ html += taskRow(t, {showList:true}); });
    html += '</ul>';
  }
  box.innerHTML = html || '<div class="empty">No matches for “'+esc(q)+'”.</div>';
}

/* ---------- Settings ---------- */
function renderSettings(){
  var nTasks = 0, nDone = 0, nLists = 0, k;
  for(k in S.tasks){ if(!S.tasks[k].deleted){ nTasks++; if(S.tasks[k].completed) nDone++; } }
  for(k in S.containers){ if(!S.containers[k].deleted) nLists++; }
  var last = metaGet('lastBackupAt', 0);
  var lastTxt = last ? dueLabel(dateKey(new Date(last))) : 'Never';
  var persisted = metaGet('persisted', null);
  var pTxt = persisted===true ? 'On' : persisted===false ? 'Not granted' : 'Unknown';

  var html = '';
  html += '<div class="sec">Backup</div>';
  html += '<button class="setrow" data-act="export"><span class="k">Export backup</span><span class="v">'+
          plural(nTasks,'task')+'</span></button>';
  html += '<button class="setrow" data-act="import"><span class="k">Import backup</span></button>';
  html += '<div class="note">Last export: '+esc(lastTxt)+'. Export before you replace index.html, and keep a copy off the phone.</div>';

  html += '<div class="sec">Your data</div>';
  html += '<button class="setrow" data-act="history"><span class="k">Completed history</span><span class="v">'+nDone+'</span></button>';
  html += '<button class="setrow" data-act="purge"><span class="k">Empty deleted items</span><span class="v">'+
          countDeleted()+'</span></button>';
  html += '<div class="setrow"><span class="k">Lists</span><span class="v">'+nLists+'</span></div>';
  html += '<div class="setrow"><span class="k">Persistent storage</span><span class="v">'+esc(pTxt)+'</span></div>';
  html += '<div class="setrow"><span class="k">Storage used</span><span class="v" id="set-usage">…</span></div>';
  html += '<div class="note">Keep Do It! on your Home Screen. Safari clears storage for sites left unused for 7 days; Home Screen apps are exempt. Deleting the icon deletes the data.</div>';

  html += '<div class="sec">Dictation</div>';
  html += '<div class="setrow"><span class="k">In-app microphone</span><span class="v">'+
          esc(Speech.status())+'</span></div>';
  html += '<div class="note">If the in-app microphone is unavailable, use the microphone on the iPhone keyboard — it works everywhere.</div>';

  html += '<div class="sec">About</div>';
  html += '<div class="setrow"><span class="k">Version</span><span class="v">'+APP_VERSION+'</span></div>';
  html += '<div class="setrow"><span class="k">Database</span><span class="v">v'+DB_VERSION+'</span></div>';
  html += '<button class="setrow" data-act="update"><span class="k">Check for update</span><span class="v">Reload</span></button>';
  html += '<div style="height:40px"></div>';
  $('settings-body').innerHTML = html;

  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(function(e){
      var u = $('set-usage');
      if(u) u.textContent = bytes(e.usage||0);
    })['catch'](function(){});
  }
}
function countDeleted(){
  var n=0, k;
  for(k in S.tasks) if(S.tasks[k].deleted) n++;
  for(k in S.containers) if(S.containers[k].deleted) n++;
  return n;
}

/* ---------- dispatcher ---------- */
function renderTab(tab){
  if(tab==='inbox') renderInbox();
  else if(tab==='today') renderToday();
  else if(tab==='lists') renderLists();
  else if(tab==='search') renderSearch();
}
function renderAll(){
  renderTab(curTab);
  if(inStack('list')) renderListScreen();
  if(inStack('done')) renderDone();
  if(inStack('settings')) renderSettings();
  if(sel.on) updateSelbar();
  updateBadges();
}
function updateBadges(){
  var n = todayTasks().due.length;
  var btn = document.querySelector('#nav button[data-tab="today"]');
  if(!btn) return;
  var b = btn.querySelector('.badge');
  if(n){
    if(!b){ b = el('span','badge'); btn.appendChild(b); }
    b.textContent = n > 99 ? '99+' : n;
  } else if(b){ b.remove(); }
}

/* ============================================================
   11. ACTIONS
   ============================================================ */
function addTask(title, containerId){
  title = String(title||'').trim();
  if(!title) return null;
  var t = newTask(title, containerId);
  S.tasks[t.id] = t;
  persist('tasks', t);
  return t;
}
function saveTask(t){ t.updatedAt = now(); persist('tasks', t); }

function toggleComplete(t){
  var undo = snapTasks([t]);
  var wasDone = !!t.completed;
  t.completed = wasDone ? 0 : 1;
  t.completedAt = wasDone ? 0 : now();
  saveTask(t);
  renderAll();
  toast(wasDone ? 'Task restored' : 'Task completed', undo);
}
function completeTasks(list){
  if(!list.length) return;
  var undo = snapTasks(list);
  list.forEach(function(t){ t.completed = 1; t.completedAt = now(); saveTask(t); });
  renderAll();
  toast(plural(list.length,'task')+' completed', undo);
}
function deleteTasks(list){
  if(!list.length) return;
  var undo = snapTasks(list);
  list.forEach(function(t){ t.deleted = 1; saveTask(t); });
  renderAll();
  toast(list.length===1 ? 'Task deleted' : plural(list.length,'task')+' deleted', undo);
}
function moveTasks(list, destId){
  if(!list.length) return;
  var undo = snapTasks(list);
  var base = nextPos(tasksIn(destId,0));
  list.forEach(function(t,i){
    t.containerId = destId;
    t.position = base + i*POS_GAP;
    saveTask(t);
  });
  renderAll();
  toast('Moved '+plural(list.length,'task')+' to '+containerLabel(destId), undo);
}
function copyTaskInto(t, destId, offset){
  var c = clone(t);
  c.id = uid();
  c.containerId = destId;
  c.completed = 0; c.completedAt = 0; c.deleted = 0;
  c.createdAt = now(); c.updatedAt = now();
  c.position = nextPos(tasksIn(destId,0)) + (offset||0);
  S.tasks[c.id] = c;
  persist('tasks', c);
  subtasksOf(t.id).forEach(function(s){
    var sc = clone(s);
    sc.id = uid(); sc.taskId = c.id; sc.createdAt = now(); sc.updatedAt = now();
    S.subtasks[sc.id] = sc;
    persist('subtasks', sc);
  });
  return c;
}
function copyTasks(list, destId){
  if(!list.length) return;
  var made = list.map(function(t,i){ return copyTaskInto(t, destId, i*POS_GAP); });
  renderAll();
  toast('Copied '+plural(list.length,'task')+' to '+containerLabel(destId), snapDeleteNew(made));
}
function duplicateTasks(list){
  if(!list.length) return;
  var made = list.map(function(t,i){ return copyTaskInto(t, t.containerId, i*POS_GAP); });
  renderAll();
  toast(plural(list.length,'task')+' duplicated', snapDeleteNew(made));
}
/* undo for "created" actions: remove what was just made */
function snapDeleteNew(made){
  return function(){
    made.forEach(function(t){
      t.deleted = 1; saveTask(t);
      subtasksOf(t.id).forEach(function(s){ s.deleted = 1; persist('subtasks', s); });
    });
    renderAll();
  };
}
function purgeTask(t){
  delete S.tasks[t.id];
  persistDel('tasks', t.id);
  subtasksOf(t.id).forEach(function(s){ delete S.subtasks[s.id]; persistDel('subtasks', s.id); });
  attachmentsOf(t.id).forEach(function(a){ delete S.attachments[a.id]; persistDel('attachments', a.id); });
}

/* ---- lists ---- */
function saveContainer(c){ c.updatedAt = now(); persist('containers', c); }
function deleteContainer(c){
  var kids = descendants(c.id).concat([c]);
  var affected = [];
  kids.forEach(function(k){ affected.push({store:'containers', rec:k}); });
  var tasks = [];
  kids.forEach(function(k){
    for(var id in S.tasks){
      var t = S.tasks[id];
      if(!t.deleted && t.containerId===k.id){ tasks.push(t); affected.push({store:'tasks', rec:t}); }
    }
  });
  var undo = snap(affected);
  kids.forEach(function(k){ k.deleted = 1; saveContainer(k); });
  tasks.forEach(function(t){ t.deleted = 1; saveTask(t); });
  if(curList && (curList===c.id || kids.some(function(k){ return k.id===curList; }))) goBack();
  renderAll();
  toast('Deleted “'+c.name+'”'+(tasks.length?' and '+plural(tasks.length,'task'):''), undo);
}
function moveContainer(c, newParent){
  if(wouldLoop(c.id, newParent)){ toast('A list cannot go inside itself', null); return; }
  var undo = snap([{store:'containers', rec:c}]);
  c.parentId = newParent;
  c.position = nextPos(siblings(newParent));
  saveContainer(c);
  renderAll();
  toast('Moved “'+c.name+'” to '+(newParent===ROOT?'top level':containerLabel(newParent)), undo);
}

/* ---- subtasks ---- */
function addSubtask(taskId, title){
  var s = newSubtask(taskId, title);
  if(!s.title) return null;
  S.subtasks[s.id] = s;
  persist('subtasks', s);
  return s;
}
function saveSubtask(s){ s.updatedAt = now(); persist('subtasks', s); }

/* ============================================================
   12. SHEETS
   Sheets stack in the order they were opened: the newest is
   always on top and the scrim sits directly beneath it.
   ============================================================ */
var openSheets = [];
function anySheetOpen(){ return openSheets.length > 0; }
function restack(){
  var scrim = $('scrim');
  openSheets.forEach(function(id, i){ $(id).style.zIndex = String(71 + i*2); });
  if(openSheets.length){
    scrim.style.zIndex = String(70 + (openSheets.length-1)*2);
    scrim.classList.add('is-open');
  } else {
    scrim.classList.remove('is-open');
  }
}
function openSheet(id){
  /* a toast belongs to the screen it came from; a new sheet supersedes it */
  if(toastEl && toastEl.classList.contains('is-up')) hideToast();
  var i = openSheets.indexOf(id);
  if(i > -1) openSheets.splice(i,1);
  openSheets.push(id);
  restack();
  $(id).classList.add('is-open');
}
function closeSheet(id){
  var i = openSheets.indexOf(id);
  if(i > -1) openSheets.splice(i,1);
  $(id).classList.remove('is-open');
  restack();
}
function closeTopSheet(){
  var top = openSheets[openSheets.length-1];
  if(!top) return;
  if(top === 'sh-task') commitTask();
  else if(top === 'sh-qc') closeQuickCapture();
  else closeSheet(top);
}
function closeSheets(){
  openSheets.slice().forEach(function(id){ $(id).classList.remove('is-open'); });
  openSheets = [];
  restack();
}

/* ---------- destination picker ---------- */
function pickContainer(opts){
  /* opts: {title, includeInbox, excludeId, allowRoot, rootLabel, current, allowCreate, onPick} */
  var html = '<div class="picklist">';
  if(opts.allowCreate){
    html += '<button class="pick newlist" data-pick="__new">'+svgi('plus')+'<span>New list</span></button>';
  }
  function on(id){ return opts.current===id ? ' on' : ''; }
  if(opts.includeInbox){
    html += '<button class="pick'+on(INBOX)+'" data-pick="'+INBOX+'"><span class="swatch" style="--c:var(--accent)"></span>'+
            '<span>Inbox</span><span class="tick">'+svgi('check')+'</span></button>';
  }
  if(opts.allowRoot){
    html += '<button class="pick'+on(ROOT)+'" data-pick="'+ROOT+'"><span class="swatch" style="--c:var(--ink-3)"></span>'+
            '<span>'+esc(opts.rootLabel||'Top level')+'</span><span class="tick">'+svgi('check')+'</span></button>';
  }
  function walk(parent, depth){
    siblings(parent).forEach(function(c){
      var bad = opts.excludeId && (c.id===opts.excludeId || wouldLoop(opts.excludeId, c.id));
      html += '<button class="pick'+on(c.id)+'"'+(bad?' disabled':'')+' data-pick="'+c.id+'" '+
        'style="--pad:'+(16+depth*18+22)+'px;padding-left:'+(16+depth*18)+'px">'+
        '<span class="swatch" style="--c:'+colourHex(c.colour)+'"></span>'+
        '<span>'+esc(c.name)+'</span><span class="tick">'+svgi('check')+'</span></button>';
      walk(c.id, depth+1);
    });
  }
  walk(ROOT, 0);
  html += '</div>';
  if(!siblings(ROOT).length && opts.allowCreate){
    html += '<div class="note">No lists yet — tap New list to make one.</div>';
  }
  $('pick-heading').textContent = opts.title || 'Choose a list';
  $('pick-body').innerHTML = html;
  $('pick-body').__onPick = opts.onPick;
  $('pick-body').__onMenu = null;
  openSheet('sh-pick');
}
/* simple action menu reusing the picker sheet */
function menu(title, actions){
  var html = '<div class="picklist">';
  actions.forEach(function(a, i){
    html += '<button class="pick'+(a.danger?' danger':'')+'" data-menu="'+i+'">'+
      '<span style="'+(a.danger?'color:var(--danger)':'')+'">'+esc(a.label)+'</span></button>';
  });
  html += '</div>';
  $('pick-heading').textContent = title;
  $('pick-body').innerHTML = html;
  $('pick-body').__onMenu = function(i){ closeSheet('sh-pick'); actions[i].run(); };
  $('pick-body').__onPick = null;
  openSheet('sh-pick');
}

/* ---------- per-task action menu ---------- */
function taskMenu(t){
  var name = t.title.length > 42 ? t.title.slice(0,42)+'…' : t.title;
  menu(name || 'Task', [
    {label:'Move to…', run:function(){
      pickContainer({title:'Move to', includeInbox:true, current:t.containerId, allowCreate:true,
        onPick:function(cid){ if(cid !== t.containerId) moveTasks([t], cid); }});
    }},
    {label:'Copy to…', run:function(){
      pickContainer({title:'Copy to', includeInbox:true, allowCreate:true,
        onPick:function(cid){ copyTasks([t], cid); }});
    }},
    {label:'Duplicate', run:function(){ duplicateTasks([t]); }},
    {label:'Complete', run:function(){ toggleComplete(t); }},
    {label:'Edit details', run:function(){ openTask(t.id); }},
    {label:'Delete', danger:true, run:function(){ deleteTasks([t]); }}
  ]);
}

/* ---------- task editor ---------- */
var editing = null, editDraft = null;
function openTask(id){
  var t = S.tasks[id];
  if(!t) return;
  editing = t;
  editDraft = {title:t.title, notes:t.notes||'', dueDate:t.dueDate||'', dueTime:t.dueTime||'',
               linkUrl:t.linkUrl||'', containerId:t.containerId};
  renderTaskSheet();
  openSheet('sh-task');
}
/* choosing a list inside the editor moves the task straight away */
function applyEditorMove(cid){
  if(!editing) return;
  if(cid !== editing.containerId){
    editing.containerId = cid;
    editing.position = nextPos(tasksIn(cid, 0));
    saveTask(editing);
  }
  editDraft.containerId = cid;
  renderTaskSheet();
  renderAll();
}
function renderTaskSheet(){
  var t = editing, d = editDraft;
  if(!t) return;
  $('task-heading').textContent = t.completed ? 'Completed task' : 'Task';
  var subs = subtasksOf(t.id), atts = attachmentsOf(t.id);
  var h = '';
  h += '<div class="field"><div class="fbox"><textarea id="te-title" rows="1" placeholder="Task name" '+
       'enterkeyhint="done">'+esc(d.title)+'</textarea></div></div>';

  h += '<div style="height:14px"></div>';
  h += '<div class="frow"><span class="fk">List</span>'+
       '<button class="fv" id="te-list" style="text-align:right;color:var(--accent)">'+esc(containerLabel(d.containerId))+'</button>'+
       '</div>';
  h += '<div class="frow"><span class="fk">Due date</span>'+
       '<input type="date" id="te-date" value="'+esc(d.dueDate)+'">'+
       (d.dueDate?'<button class="clear" data-clear="date">'+svgi('x')+'</button>':'')+'</div>';
  h += '<div class="frow"><span class="fk">Time</span>'+
       '<input type="time" id="te-time" value="'+esc(d.dueTime)+'">'+
       (d.dueTime?'<button class="clear" data-clear="time">'+svgi('x')+'</button>':'')+'</div>';

  h += '<div class="sec">Notes</div>';
  h += '<div class="field"><div class="fbox"><textarea id="te-notes" placeholder="Anything worth remembering">'+esc(d.notes)+'</textarea></div></div>';

  h += '<div class="sec">Link</div>';
  h += '<div class="field"><div class="fbox"><input id="te-link" type="url" inputmode="url" '+
       'autocapitalize="none" autocorrect="off" placeholder="example.com" value="'+esc(d.linkUrl)+'"></div>';
  if(d.linkUrl) h += '<div class="note"><a href="'+esc(normUrl(d.linkUrl))+'" target="_blank" rel="noopener">Open '+esc(d.linkUrl)+'</a></div>';
  h += '</div>';

  h += '<div class="sec">Subtasks'+(subs.length?' ('+subs.filter(function(s){return s.completed;}).length+'/'+subs.length+')':'')+'</div>';
  h += '<div class="subs" id="te-subs">';
  subs.forEach(function(s){
    h += '<div class="sub'+(s.completed?' done':'')+'" data-sub="'+s.id+'">'+
      '<button class="check" data-subcheck="'+s.id+'"><i></i>'+svgi('check')+'</button>'+
      '<input type="text" value="'+esc(s.title)+'" data-subtitle="'+s.id+'" enterkeyhint="done">'+
      '<button class="x" data-subdel="'+s.id+'">'+svgi('x')+'</button>'+
      '<span class="grip" data-drag>'+svgi('grip')+'</span></div>';
  });
  h += '<div class="addsub">'+svgi('plus')+
       '<input type="text" id="te-newsub" placeholder="Add a step" enterkeyhint="enter" '+
       'style="flex:1;font-size:16px;padding:9px 0"></div>';
  h += '</div>';

  h += '<div class="sec">Attachments</div>';
  h += '<div class="atts">';
  atts.forEach(function(a){
    var isImg = /^image\//.test(a.mimeType||'');
    var src = '';
    if(isImg && a.blob){ try{ src = URL.createObjectURL(a.blob); }catch(e){} }
    h += '<div class="att" data-att="'+a.id+'">'+
      (src ? '<img src="'+src+'" alt="">' : '<span class="fname">'+esc(a.fileName||'file')+'</span>')+
      '<button class="x" data-attdel="'+a.id+'">'+svgi('x')+'</button></div>';
  });
  h += '<button class="att add" id="te-addatt">'+svgi('plus')+'</button>';
  h += '</div>';

  h += '<div class="sec">&nbsp;</div>';
  h += '<button class="setrow danger" id="te-delete"><span class="k">Delete task</span></button>';
  h += '<div style="height:24px"></div>';
  $('task-body').innerHTML = h;
  autoGrow($('te-title'));
}
function autoGrow(ta){
  if(!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
}
function commitTask(){
  if(!editing) return;
  var t = editing, d = editDraft;
  var tb = $('te-title'), nb = $('te-notes'), lb = $('te-link'),
      db2 = $('te-date'), tm = $('te-time'), ns = $('te-newsub');
  if(ns && ns.value.trim()) addSubtask(t.id, ns.value);
  t.title   = tb ? tb.value.trim() : d.title;
  t.notes   = nb ? nb.value : d.notes;
  t.linkUrl = lb ? lb.value.trim() : d.linkUrl;
  t.dueDate = db2 ? db2.value : d.dueDate;
  t.dueTime = tm ? tm.value : d.dueTime;
  if(!t.title) t.title = 'Untitled';
  if(d.containerId !== t.containerId) t.containerId = d.containerId;
  saveTask(t);
  editing = null; editDraft = null;
  closeSheet('sh-task');
  renderAll();
}

function commitList(){
  var d = listDraft;
  if(!d) return;
  var nameEl = $('le-name');
  d.name = nameEl ? nameEl.value.trim() : String(d.name||'').trim();
  if(!d.name) d.name = 'New list';
  var createdId = null;
  if(d.id){
    var c = S.containers[d.id];
    if(c){
      var changedParent = c.parentId !== d.parentId;
      c.name = d.name; c.colour = d.colour;
      if(changedParent && !wouldLoop(c.id, d.parentId)){
        c.parentId = d.parentId;
        c.position = nextPos(siblings(d.parentId));
      }
      saveContainer(c);
    }
  } else {
    var nc = newContainer(d.name, d.parentId, d.colour);

  closeSheet('sh-list');

  if(createdId && cb) cb(createdId);
}
